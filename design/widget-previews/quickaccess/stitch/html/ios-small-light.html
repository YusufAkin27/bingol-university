<!doctype html><meta charset=utf-8><style>@font-face{font-family:Inter;src:url(assets/Inter-Regular.ttf);font-weight:400}
*{box-sizing:border-box;margin:0;padding:0;font-weight:400;font-family:Inter,sans-serif}
html,body{background:transparent}
.w{width:158px;height:158px;border-radius:22px;background:#FFFFFF;color:#09090B;border:1px solid #E4E4E7;padding:16px;display:flex;flex-direction:column;overflow:hidden;position:relative}
.cap{font-size:10px;line-height:12px;letter-spacing:.08em;text-transform:uppercase;color:#71717A;display:flex;align-items:center;gap:4px;white-space:nowrap}
.cap svg{flex:none}
.hd{display:flex;justify-content:space-between;align-items:center;height:16px;margin-bottom:12px;flex:none}
.hd img{height:12px;opacity:.9}
.t1{color:#09090B}.t2{color:#52525B}.t3{color:#71717A}
.disp{font-size:22px;line-height:26px;letter-spacing:-.02em}
.ttl{font-size:17px;line-height:22px;letter-spacing:-.01em}
.q15{font-size:15px;line-height:20px;letter-spacing:-.01em}
.bd{font-size:13px;line-height:18px}.bs{font-size:12px;line-height:16px}.mi{font-size:11px;line-height:14px}
.num{font-size:34px;line-height:38px;letter-spacing:-.03em}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ell2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ell3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.row{display:flex;align-items:center;gap:8px}.sp{flex:1;min-width:0}
.grow{flex:1}.col{display:flex;flex-direction:column}
.kc{display:flex;align-items:center;gap:4px;font-size:12px;line-height:16px;color:#52525B;white-space:nowrap}
.div{height:1px;background:#E4E4E7}
.inv{background:#09090B;color:#FFFFFF;border-radius:999px;padding:6px 14px;font-size:13px;line-height:16px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip{background:#F4F4F5}
.bar{height:4px;border-radius:2px;background:#E4E4E7;overflow:hidden}.bar i{display:block;height:100%;border-radius:2px;background:#09090B}
.bar.dimb i{opacity:.45}
.tile{background:#F4F4F5;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-width:0}
.tile .mi{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#52525B}
.red{color:#DC2626}
