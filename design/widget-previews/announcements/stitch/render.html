<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BU widget renderer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
/* Tek kaynak: README.md olculeri. 1 CSS px = 1 pt (iOS) = 1 dp (Android). */
:root{--fw-light:300;--fw:400}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',-apple-system,sans-serif;font-weight:400;letter-spacing:-0.011em}
body{background:transparent;display:inline-block}
.w{position:relative;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--bd)}
.dark{--bg:#18181B;--bd:#27272A;--t1:#FAFAFA;--t2:#A1A1AA;--t3:#71717A;--dv:#27272A;--bdg:#09090B;--bdgb:#3F3F46}
.light{--bg:#FFFFFF;--bd:#E4E4E7;--t1:#09090B;--t2:#52525B;--t3:#71717A;--dv:#E4E4E7;--bdg:#F4F4F5;--bdgb:#D4D4D8}
.w{background:var(--bg);color:var(--t1)}
svg{stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hd{display:flex;align-items:center;gap:6px;color:var(--t2);font-size:11px;line-height:14px}
.hd .sp{flex:1}
.hd img{height:14px;width:auto;display:block}
.cnt{color:var(--t3)}
.tt{color:var(--t1)}
.t2{color:var(--t2)}.t3{color:var(--t3)}
.cl2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cl4{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bdg{border:1px solid var(--bdgb);background:var(--bdg);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.bdg .d{color:var(--t1)}.bdg .m{color:var(--t2);text-transform:uppercase;letter-spacing:.08em}
.row{display:flex;align-items:center;min-width:0}
.mi{display:flex;align-items:center;gap:4px;color:var(--t2);min-width:0}
.dv{height:1px;background:var(--dv);flex:none}
.dot{width:4px;height:4px;border-radius:50%;flex:none}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.empty svg{color:var(--t3)}
</style></head><body>
<div id="root"></div>
<script>
const Q=new URLSearchParams(location.search);
const W=Q.get('w')||'events',P=Q.get('p')||'ios',S=Q.get('s')||'small',T=Q.get('t')||'dark',E=Q.get('e')==='1';
const DIM={ios:{small:[158,158],medium:[338,158],large:[338,354]},android:{small:[170,170],medium:[350,170],large:[350,350]}}[P][S];
const R=P==='ios'?22:28;
const I={
cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
clk:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
pin:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
mega:'<path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>'
};
const ic=(n,px)=>`<svg width="${px}" height="${px}" viewBox="0 0 24 24">${I[n]}</svg>`;
const logo=`<img src="/mobile/assets/branding/logo_${T==='dark'?'dark':'light'}.png" alt="BU">`;
const EV=[
 {d:'12',m:'KAS',t:'Yapay Zeka Söyleşisi',c:'Bilgisayar Topluluğu',h:'14:00',v:'Konferans Salonu'},
 {d:'15',m:'KAS',t:'Bahar Şenliği Hazırlık Toplantısı',c:'Müzik Kulübü',h:'17:30',v:'Öğrenci Merkezi'},
 {d:'18',m:'KAS',t:'Fotoğraf Yürüyüşü',c:'Fotoğraf Kulübü',h:'10:00',v:'Kampüs Girişi'}];
const AN=[
 {t:'Yemekhane Öğle Servis Saatleri Güncellendi',s:'SKS',d:'05 Kas'},
 {t:'2026-2027 Güz Dönemi Ara Sınav Takvimi Yayınlandı',s:'Öğrenci İşleri',d:'04 Kas'},
 {t:'Erasmus+ Başvuru Sonuçları Açıklandı',s:'Uluslararası İlişkiler',d:'03 Kas'},
 {t:'Kütüphane Hafta Sonu Açık Kalacak',s:'Kütüphane',d:'01 Kas'}];
const hdr=(txt,right,icon)=>`<div class="hd">${logo}<span>${txt}</span><span class="sp"></span>${right?`<span class="cnt">${right}</span>`:''}</div>`;
function evSmall(){
 if(E)return `<div class="hd">${ic('cal',14)}<span>Etkinlik</span></div><div class="empty">${ic('cal',20)}<div class="t2" style="font-size:13px;line-height:17px">Yaklaşan etkinlik yok</div></div>`;
 const e=EV[0];
 return `<div class="hd">${ic('cal',14)}<span>Yaklaşan</span></div>
 <div style="margin-top:10px;display:flex;align-items:baseline;gap:6px"><span style="font-size:34px;line-height:36px;font-weight:300">${e.d}</span><span class="t2" style="font-size:12px;letter-spacing:.08em">${e.m}</span></div>
 <div style="flex:1"></div>
 <div class="tt cl2" style="font-size:14px;line-height:18px">${e.t}</div>
 <div class="mi" style="margin-top:6px;font-size:11px;line-height:14px">${ic('clk',12)}<span>${e.h}</span></div>`;
}
function evMedium(){
 const n=P==='ios'?3:3, rh=P==='ios'?30:36;
 if(E)return hdr('Yaklaşan Etkinlikler','')+`<div class="empty">${ic('cal',22)}<div class="t2" style="font-size:13px;line-height:17px">Yaklaşan etkinlik yok</div><div class="t3" style="font-size:11px">Kulüpler yeni etkinlik eklediğinde burada görünür</div></div>`;
 let h=hdr('Yaklaşan Etkinlikler','')+`<div style="flex:1;display:flex;flex-direction:column;justify-content:space-between;margin-top:10px">`;
 EV.slice(0,n).forEach(e=>{h+=`<div class="row" style="gap:10px;height:${rh}px">
  <div class="bdg" style="width:${rh}px;height:${rh}px;border-radius:8px"><span class="d" style="font-size:13px;line-height:13px">${e.d}</span><span class="m" style="font-size:9px;line-height:10px;margin-top:1px">${e.m}</span></div>
  <div style="flex:1;min-width:0"><div class="tt ell" style="font-size:13px;line-height:17px">${e.t}</div><div class="t2 ell" style="font-size:11px;line-height:14px">${e.c}</div></div>
  <div class="mi" style="font-size:12px;line-height:14px">${ic('clk',12)}<span>${e.h}</span></div></div>`});
 return h+'</div>';
}
function evLarge(){
 if(E)return hdr('Yaklaşan Etkinlikler','')+`<div class="empty">${ic('cal',28)}<div class="t2" style="font-size:15px;line-height:20px">Yaklaşan etkinlik yok</div><div class="t3" style="font-size:12px;line-height:16px;max-width:220px">Kulüpler yeni etkinlik eklediğinde burada görünür</div></div>`;
 let h=hdr('Yaklaşan Etkinlikler','3 etkinlik')+`<div class="dv" style="margin:12px 0 4px"></div><div style="flex:1;display:flex;flex-direction:column;justify-content:space-between">`;
 EV.forEach((e,i)=>{h+=`${i?'<div class="dv"></div>':''}<div class="row" style="gap:12px;flex:1;align-items:center">
  <div class="bdg" style="width:44px;height:48px;border-radius:10px"><span class="d" style="font-size:18px;line-height:20px">${e.d}</span><span class="m" style="font-size:10px;line-height:12px;margin-top:2px">${e.m}</span></div>
  <div style="flex:1;min-width:0"><div class="tt ell" style="font-size:15px;line-height:20px">${e.t}</div><div class="t2 ell" style="font-size:12px;line-height:16px;margin-top:1px">${e.c}</div>
  <div class="row" style="gap:12px;margin-top:4px;font-size:12px;line-height:16px;color:var(--t2)"><span class="mi">${ic('clk',14)}<span>${e.h}</span></span><span class="mi" style="min-width:0">${ic('pin',14)}<span class="ell">${e.v}</span></span></div></div></div>`});
 return h+'</div>';
}
function anSmall(){
 if(E)return `<div class="hd">${ic('mega',14)}<span>Duyurular</span></div><div class="empty">${ic('mega',20)}<div class="t2" style="font-size:13px;line-height:17px">Yeni duyuru yok</div></div>`;
 const a=AN[0];
 return `<div class="hd">${ic('mega',14)}<span>Duyurular</span></div>
 <div class="tt cl4" style="margin-top:10px;font-size:15px;line-height:20px">${a.t}</div><div style="flex:1"></div>
 <div class="t2 ell" style="font-size:11px;line-height:14px">${a.s} · ${a.d}</div>`;
}
function anMedium(){
 if(E)return hdr('Kampüs Duyuruları','')+`<div class="empty">${ic('mega',22)}<div class="t2" style="font-size:13px;line-height:17px">Yeni duyuru yok</div><div class="t3" style="font-size:11px">Yeni duyurular burada görünür</div></div>`;
 const rh=P==='ios'?30:36;
 let h=hdr('Kampüs Duyuruları','')+`<div style="flex:1;display:flex;flex-direction:column;justify-content:space-between;margin-top:10px">`;
 AN.slice(0,3).forEach((a,i)=>{h+=`<div class="row" style="gap:8px;height:${rh}px"><span class="dot" style="background:${i?'var(--bdgb)':'var(--t1)'}"></span>
 <div style="flex:1;min-width:0"><div class="${i?'t2':'tt'} ell" style="font-size:13px;line-height:17px">${a.t}</div><div class="t3 ell" style="font-size:11px;line-height:14px">${a.s} · ${a.d}</div></div></div>`});
 return h+'</div>';
}
function anLarge(){
 if(E)return hdr('Kampüs Duyuruları','')+`<div class="empty">${ic('mega',28)}<div class="t2" style="font-size:15px;line-height:20px">Yeni duyuru yok</div><div class="t3" style="font-size:12px;line-height:16px;max-width:220px">Yeni duyurular burada görünür</div></div>`;
 let h=hdr('Kampüs Duyuruları','Son 4')+`<div class="dv" style="margin:12px 0 4px"></div><div style="flex:1;display:flex;flex-direction:column">`;
 AN.forEach((a,i)=>{h+=`${i?'<div class="dv"></div>':''}<div style="flex:1;display:flex;flex-direction:column;justify-content:center">
 <div class="${i?'t2':'tt'} cl2" style="font-size:14px;line-height:18px">${a.t}</div>
 <div class="t3 ell" style="font-size:11px;line-height:14px;margin-top:3px">${a.s} · ${a.d}</div></div>`});
 return h+'</div>';
}
const F={events:{small:evSmall,medium:evMedium,large:evLarge},announcements:{small:anSmall,medium:anMedium,large:anLarge}};
const pad=16;
document.getElementById('root').innerHTML=`<div class="w ${T}" id="w" style="width:${DIM[0]}px;height:${DIM[1]}px;border-radius:${R}px;padding:${pad-1}px">${F[W][S]()}</div>`;
</script></body></html>
