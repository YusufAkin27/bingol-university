# Codemagic iOS yayin hatti (GitHub Actions ios-release.yml'e ALTERNATIF; ikisini birden kurmak gerekmez).
# Windows'ta CALISTIRILAMADI: ilk kosuyu izleyin (docs/IOS_RELEASE.md bolum 9). Sir yok; yalniz isimler.
# Codemagic kurulumu: (1) Teams > Integrations > Developer Portal: App Store Connect API anahtari ekleyin
#   (ad: bu_kampus_asc  <- asagidaki integrations.app_store_connect ile ayni olmali); (2) Environment variables
#   grubu "bu_ios" olusturun: IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 (Secure), API_BASE (https://bukampus.com.tr);
#   APP_STORE_APPLE_ID (App Store Connect > Uygulama > Genel Bilgi > Apple ID, sayi) ekleyin: yapi numarasi
#   TestFlight'taki son numara + 1 olur (yoksa pubspec +N ile Codemagic kosu sayaci toplanir).
#   (3) Code signing identities'e gerek yok: ios_signing App Store Connect API anahtariyla profili/sertifikayi otomatik uretir.
workflows:
  ios-release:
    name: BU Kampus iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 75
    working_directory: mobile
    integrations:
      app_store_connect: bu_kampus_asc
    environment:
      groups:
        - bu_ios
      flutter: 3.47.8
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "tr.com.bukampus.app"   # KULLANICI KARARI (2026-10-31), Android applicationId ile ayni
      ios_signing:
        distribution_type: app_store
        bundle_identifier: tr.com.bukampus.app
    triggering:
      events: []   # yalniz elle (Codemagic arayuzu veya API)
    scripts:
      - name: Dosya duzeyi iOS kontrolu
        script: python3 ../scripts/ios/check-ios-static.py
      - name: GoogleService-Info.plist + push yetkisi
        script: |
          export REQUIRE_PUSH=1
          bash ../scripts/ios/prepare-ci.sh
      - name: Flutter bagimliliklari
        script: flutter pub get
      - name: Surum numarasi (CFBundleShortVersionString = pubspec; CFBundleVersion TestFlight cakismasiz)
        script: |
          VERSION_LINE="$(grep -E '^version:' pubspec.yaml | head -1 | sed 's/version:[[:space:]]*//')"
          NAME="${VERSION_LINE%%+*}"
          BASE="${VERSION_LINE##*+}"
          NUM=""
          if [ -n "${APP_STORE_APPLE_ID:-}" ]; then
            LAST="$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null | tr -dc '0-9' || true)"
            if [ -n "$LAST" ]; then NUM=$((LAST + 1)); fi
          fi
          if [ -z "$NUM" ] || [ "$NUM" -lt "$BASE" ]; then NUM=$((BASE + ${PROJECT_BUILD_NUMBER:-0})); fi
          echo "BUILD_NAME=$NAME" >> $CM_ENV
          echo "BUILD_NUMBER=$NUM" >> $CM_ENV
          echo "Surum $NAME ($NUM)"
      - name: Xcode projesine imza profillerini uygula
        script: xcode-project use-profiles
      - name: IPA
        script: |
          flutter build ipa --release \
            --obfuscate --split-debug-info=$CM_BUILD_DIR/symbols \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=API_BASE="${API_BASE:-https://bukampus.com.tr}" \
            --dart-define=APP_VERSION="$BUILD_NAME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - ysufakin23@gmail.com
        notify:
          success: true
          failure: true
