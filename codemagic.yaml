# Codemagic iOS yayin hatti (GitHub Actions ios-release.yml'e ALTERNATIF; ikisini birden kurmak gerekmez).
# Windows'ta CALISTIRILAMADI: ilk kosuyu izleyin (docs/IOS_RELEASE.md bolum 9). Sir yok; yalniz isimler.
# Codemagic kurulumu: (1) Teams > Integrations > Developer Portal: App Store Connect API anahtari ekleyin
#   (ad: bu_kampus_asc  <- asagidaki integrations.app_store_connect ile ayni olmali); (2) Environment variables
#   grubu "bu_ios" olusturun: IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 (Secure), API_BASE (https://bukampus.com.tr),
#   GOOGLE_SIGNIN / APPLE_SIGNIN (true: Google / Apple dugmesini acar; sunucuda GOOGLE_CLIENT_IDS / APPLE_CLIENT_IDS hazir olunca; varsayilan TRUE; kapatmak icin false verin);
#   APP_STORE_APPLE_ID (App Store Connect > Uygulama > Genel Bilgi > Apple ID, sayi) ekleyin: yapi numarasi
#   TestFlight'taki son numara + 1 olur (yoksa pubspec +N ile Codemagic kosu sayaci toplanir).
#   (3) Code signing identities: sertifika bu_dist + 4 profil (bu_app_store, bu_notif_service, bu_notif_content, bu_widgets) elle yuklenir (bkz. ios_signing).
workflows:
  ios-release:
    name: BU Kampus iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 75
    working_directory: mobile
    integrations:
      app_store_connect: bu_kampus_asc
    environment:
      groups:
        - bu_ios
      flutter: 3.47.8
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "tr.com.bukampus.app"   # KULLANICI KARARI (2026-10-31), Android applicationId ile ayni
      # ELLE imza: uygulama + 2 bildirim uzantisi (NotificationService, NotificationContent) + widget uzantisi (BUWidgets,
      # tr.com.bukampus.app.widgets; App ID + App Group yetenegi gerekir, docs/IOS_RELEASE.md) = 4 App Store profili.
      # Codemagic > Settings > Code signing identities: sertifika referans adi bu_dist; iOS provisioning profiles sekmesine
      # 4 profil yuklenir (referans adlari asagidaki gibi). Profiller Apple Developer > Profiles > App Store Connect, sertifika bu_dist.
      ios_signing:
        certificates:
          - bu_dist
        provisioning_profiles:
          - bu_app_store
          - bu_notif_service
          - bu_notif_content
          - bu_widgets
    triggering:
      events: []   # yalniz elle (Codemagic arayuzu veya API)
    scripts:
      - name: Dosya duzeyi iOS kontrolu
        script: python3 ../scripts/ios/check-ios-static.py
      - name: GoogleService-Info.plist + push yetkisi
        script: |
          export REQUIRE_PUSH=1
          bash ../scripts/ios/prepare-ci.sh
      - name: Flutter bagimliliklari
        script: flutter pub get
      - name: Surum numarasi (CFBundleShortVersionString = pubspec; CFBundleVersion TestFlight cakismasiz)
        script: |
          VERSION_LINE="$(grep -E '^version:' pubspec.yaml | head -1 | sed 's/version:[[:space:]]*//')"
          NAME="${VERSION_LINE%%+*}"
          BASE="${VERSION_LINE##*+}"
          NUM=""
          if [ -n "${APP_STORE_APPLE_ID:-}" ]; then
            LAST="$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null | tr -dc '0-9' || true)"
            if [ -n "$LAST" ]; then NUM=$((LAST + 1)); fi
          fi
          if [ -z "$NUM" ] || [ "$NUM" -lt "$BASE" ]; then NUM=$((BASE + ${PROJECT_BUILD_NUMBER:-0})); fi
          echo "BUILD_NAME=$NAME" >> $CM_ENV
          echo "BUILD_NUMBER=$NUM" >> $CM_ENV
          echo "Surum $NAME ($NUM)"
      - name: Xcode projesine imza profillerini uygula
        script: xcode-project use-profiles
      - name: IPA
        script: |
          # Google ile giris: dugme yalniz GOOGLE_SIGNIN=true iken gorunur (sunucuda GOOGLE_CLIENT_IDS hazir olunca bu_ios
          # grubunda GOOGLE_SIGNIN=true yapin). Istemci kimlikleri varsayilan olarak kodda (lib/core/oauth_config.dart) ve
          # Info.plist'te (GIDClientID + ters kimlik URL semasi) gomuludur; GOOGLE_SERVER_CLIENT_ID / GOOGLE_IOS_CLIENT_ID
          # tanimlanirsa dart-define ile gecersiz kilinir (iOS kimligini degistirirseniz Info.plist de degismeli).
          OAUTH_DEFINES="--dart-define=GOOGLE_SIGNIN=${GOOGLE_SIGNIN:-true} --dart-define=APPLE_SIGNIN=${APPLE_SIGNIN:-true}"
          if [ -n "${GOOGLE_SERVER_CLIENT_ID:-}" ]; then OAUTH_DEFINES="$OAUTH_DEFINES --dart-define=GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID"; fi
          if [ -n "${GOOGLE_IOS_CLIENT_ID:-}" ]; then OAUTH_DEFINES="$OAUTH_DEFINES --dart-define=GOOGLE_IOS_CLIENT_ID=$GOOGLE_IOS_CLIENT_ID"; fi
          flutter build ipa --release \
            --obfuscate --split-debug-info=$CM_BUILD_DIR/symbols \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=API_BASE="${API_BASE:-https://bukampus.com.tr}" \
            --dart-define=APP_VERSION="$BUILD_NAME" \
            $OAUTH_DEFINES
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - ysufakin23@gmail.com
        notify:
          success: true
          failure: true
