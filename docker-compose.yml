# Calistirma: cp .env.example .env  ->  docker compose up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEM_LIMIT:-1g}
    # PostgreSQL ayari (yerel gelistirme, 1 GB sinirina gore; uretim: docker-compose.prod.yml, docs/DATABASE.md bolum 6).
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.max=5000
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-640MB}
      - -c
      - work_mem=${PG_WORK_MEM:-8MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-64MB}
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-100}
      - -c
      - max_wal_size=2GB
      - -c
      - min_wal_size=256MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - autovacuum_max_workers=4
      - -c
      - autovacuum_naptime=30s
      - -c
      - autovacuum_vacuum_cost_limit=800
      - -c
      - log_autovacuum_min_duration=1s
      - -c
      - log_min_duration_statement=${PG_LOG_MIN_DURATION_MS:-500}
      - -c
      - log_lock_waits=on
      - -c
      - log_temp_files=10MB
      - -c
      - temp_file_limit=2GB
      - -c
      - track_io_timing=on
    environment:
      POSTGRES_DB: bingol
      POSTGRES_USER: bingol
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD gerekli (.env)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bingol -d bingol"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: ${REDIS_MEM_LIMIT:-256m}
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    # Gelistirme makinesinde bellek tasarrufu icin .env ile ezilebilir (ornek: BACKEND_MEM_LIMIT=512m,
    # JAVA_TOOL_OPTIONS=-Xmx300m -XX:+UseSerialGC). Varsayilan davranis degismez.
    mem_limit: ${BACKEND_MEM_LIMIT:-1g}
    cpus: ${BACKEND_CPUS:-2}
    restart: unless-stopped
    stop_grace_period: 40s   # server.shutdown=graceful (30 sn) + pay
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/bingol
      DB_USER: bingol
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD gerekli (.env)}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET gerekli (.env)}
      SPRING_SECURITY_USER_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD gerekli (.env)}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@bukampus.online}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-}
      MAIL_REQUIRE_TLS: ${MAIL_REQUIRE_TLS:-false}
      MAIL_SSL: ${MAIL_SSL:-false}
      MAIL_MAX_PER_MINUTE: ${MAIL_MAX_PER_MINUTE:-30}
      MAIL_RECIPIENT_GAP_SECONDS: ${MAIL_RECIPIENT_GAP_SECONDS:-300}
      MAIL_DAILY_LIMIT: ${MAIL_DAILY_LIMIT:-0}
      MAIL_DAILY_RESERVE: ${MAIL_DAILY_RESERVE:-60}
      MAIL_DAILY_RESET_HOUR_UTC: ${MAIL_DAILY_RESET_HOUR_UTC:-21}
      MAIL_UNSUBSCRIBE_KEY: ${MAIL_UNSUBSCRIBE_KEY:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      STORAGE_DIR: /data/uploads
      # DS1 depolama doluluk uyarisi (docs/DATABASE.md bolum 15): esikler ve DB sunucusu diski (olculen yol ya da kapasite)
      OBS_STORAGE_WARN_PERCENT: ${OBS_STORAGE_WARN_PERCENT:-80}
      OBS_STORAGE_CRIT_PERCENT: ${OBS_STORAGE_CRIT_PERCENT:-90}
      STORAGE_DB_DISK_PATH: ${STORAGE_DB_DISK_PATH:-}
      STORAGE_DB_DISK_CAPACITY_BYTES: ${STORAGE_DB_DISK_CAPACITY_BYTES:-0}
      STORAGE_RESERVED_BYTES: ${STORAGE_RESERVED_BYTES:-0}
      FCM_CREDENTIALS_FILE: ${FCM_CREDENTIALS_FILE:-}
      # Firebase servis hesabi anahtari (ham JSON ya da base64, tek satir); bkz. docs/PUSH_SETUP.md
      FCM_CREDENTIALS_JSON: ${FCM_CREDENTIALS_JSON:-}
      TZ: Europe/Istanbul
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:-}
      # Uretimde "prod" (zorunlu ayarlar acilista dogrulanir); bos = profilsiz yerel davranis
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      INITIAL_FILL: ${INITIAL_FILL:-true}
      SWAGGER_UI_ENABLED: ${SWAGGER_UI_ENABLED:-false}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:8090}
      # T21: mesaj sifreleme ana anahtarlari (bos = uyarili gelistirme anahtari; bkz. docs/ENCRYPTION.md)
      CRYPTO_MASTER_KEYS: ${CRYPTO_MASTER_KEYS:-}
      CRYPTO_ACTIVE_KEY_ID: ${CRYPTO_ACTIVE_KEY_ID:-}
      CRYPTO_REQUIRE_KEYS: ${CRYPTO_REQUIRE_KEYS:-false}
      CRYPTO_ADMIN_DECRYPT_ENABLED: ${CRYPTO_ADMIN_DECRYPT_ENABLED:-true}
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && printf \"GET /actuator/health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # Tanıtım sitesi + /admin paneli (nginx; /api, /files, /ws backend'e vekillenir)
  web:
    build:
      context: ./web
      args:
        VITE_ADMIN_PATH: ${ADMIN_PATH:-}
        PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8090}:80"

volumes:
  pgdata:
  redisdata:
  uploads:
