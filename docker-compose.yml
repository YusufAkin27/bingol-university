# Calistirma: cp .env.example .env  ->  docker compose up -d --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bingol
      POSTGRES_USER: bingol
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD gerekli (.env)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bingol -d bingol"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    # Gelistirme makinesinde bellek tasarrufu icin .env ile ezilebilir (ornek: BACKEND_MEM_LIMIT=512m,
    # JAVA_TOOL_OPTIONS=-Xmx300m -XX:+UseSerialGC). Varsayilan davranis degismez.
    mem_limit: ${BACKEND_MEM_LIMIT:-1g}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/bingol
      DB_USER: bingol
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD gerekli (.env)}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET gerekli (.env)}
      SPRING_SECURITY_USER_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD gerekli (.env)}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@bingol.edu.tr}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      STORAGE_DIR: /data/uploads
      FCM_CREDENTIALS_FILE: ${FCM_CREDENTIALS_FILE:-}
      TZ: Europe/Istanbul
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:-}
      # T21: mesaj sifreleme ana anahtarlari (bos = uyarili gelistirme anahtari; bkz. docs/ENCRYPTION.md)
      CRYPTO_MASTER_KEYS: ${CRYPTO_MASTER_KEYS:-}
      CRYPTO_ACTIVE_KEY_ID: ${CRYPTO_ACTIVE_KEY_ID:-}
      CRYPTO_REQUIRE_KEYS: ${CRYPTO_REQUIRE_KEYS:-false}
      CRYPTO_ADMIN_DECRYPT_ENABLED: ${CRYPTO_ADMIN_DECRYPT_ENABLED:-true}
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && printf \"GET /actuator/health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # Tanıtım sitesi + /admin paneli (nginx; /api, /files, /ws backend'e vekillenir)
  web:
    build:
      context: ./web
      args:
        VITE_ADMIN_PATH: ${ADMIN_PATH:-}
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8090}:80"

volumes:
  pgdata:
  redisdata:
  uploads:
