# Her Spring baglami KENDI bellek-ici veritabanini alir (${random.uuid}): onbellekteki eski baglamin sorgulari ve yeni baglamin
# create-drop'u ayni semayi ezmez. Not: ayni baglamda deger bir kez cozulur (DataSourceProperties'e baglanir).
spring.datasource.url=jdbc:h2:mem:${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
app.sync.initial-fill=false
app.storage.dir=./target/test-uploads
jwt.secret=test-secret-test-secret-test-secret-1234
spring.security.user.name=admin
spring.security.user.password=test-admin-pw
# Testlerde Redis yok: Basic auth kisitlayicisi Redis hatasinda gecirsin (uretimde fail-closed)
app.security.admin-basic.fail-closed=false
app.messaging.redis-listener=false

# T7: Swagger arayuzu uretim varsayilani (kapali)
springdoc.swagger-ui.enabled=false

# P02/P04: testlerde yonetici sebep zorunlulugu kapali (birim testleri ayrica acik durumu dener)
app.admin.require-reason=false

# Uretimle ayni: istek dili bulunamazsa JVM yerel diline DEGIL varsayilan (tr) metne dus (testler JVM yerelinden bagimsiz olsun)
spring.messages.fallback-to-system-locale=false

# FIX-P10: testlerde @Scheduled islemesi KAPALI (config/SchedulingEnabledConfig). Her Spring baglami ~47 zamanlayici isi
# (mail/push 5 sn, presence 10 sn ...) baslatirdi; Redis olmadigindan her turda hata yigini. Isi test dogrudan cagirir;
# zamanlayiciyi sinayan test kendi baglaminda app.scheduling.enabled=true verir.
app.scheduling.enabled=false

# FINAL-ALL: sistem durumu paneli onbellegi testte kapali (yedek durum dosyasi degistirilip hemen okunur).
app.observability.overview-cache-ms=0

# FINAL-ALL: uye/katilimci bildirim dagitimi testte ayni is parcaciginda hemen calisir (havuz/commit beklenmez).
app.notification.fanout-inline=true
