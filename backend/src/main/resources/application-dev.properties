# Yerel gelistirme profili (SPRING_PROFILES_ACTIVE=dev). Yalnizca kendi makinenizde kullanin.
spring.jpa.show-sql=false
logging.level.edu.bingol=DEBUG
logging.level.org.springframework.security=INFO

# Swagger arayuzu + OpenAPI belgesi acik (yine de yalnizca ADMIN erisir: admin / ADMIN_PASSWORD)
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# Ayrintili hata (yalnizca yerel)
server.error.include-message=always
server.error.include-binding-errors=always

# Actuator: yerelde ek uclar
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Gelistirmede dogrulama kodu e-posta yerine log'a yazilir
app.mail.enabled=${MAIL_ENABLED:false}
