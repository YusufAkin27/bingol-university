# Kampus Forum ceviri anahtarlari (C anket ar). Hata anahtari: error.FORUM_<KOD>; UTF-8, BOM yok.
error.FORUM_POLL_NOT_FOUND=الاستطلاع غير موجود.
error.FORUM_POLL_OPTION_NOT_FOUND=الخيار غير موجود.
error.FORUM_POLL_OPTION_REQUIRED=يرجى اختيار أحد الخيارات.
error.FORUM_POLL_CLOSED=هذا الاستطلاع مغلق ولا يقبل المزيد من الأصوات.
error.FORUM_POLL_ALREADY_VOTED=لا يمكنك تغيير صوتك في هذا الاستطلاع.
error.FORUM_POLL_CHANGE_NOT_ALLOWED=لا يمكن سحب الصوت في هذا الاستطلاع.
error.FORUM_POLL_EXISTS=هذا الموضوع لديه استطلاع بالفعل.
error.FORUM_POLL_OPTIONS_INVALID=يجب أن يحتوي الاستطلاع على خيارين إلى ستة خيارات ولا يمكن أن تكون الخيارات فارغة.
error.FORUM_POLL_OPTION_TOO_LONG=يمكن أن يصل طول كل خيار إلى {0} حرفًا كحد أقصى.
error.FORUM_POLL_QUESTION_TOO_LONG=يمكن أن يصل طول سؤال الاستطلاع إلى {0} حرفًا كحد أقصى.
error.FORUM_POLL_DUPLICATE_OPTION=لا يمكن إدخال الخيار نفسه أكثر من مرة.
error.FORUM_POLL_ENDS_INVALID=يجب أن يكون وقت الانتهاء في المستقبل وبعد {0} يومًا على الأكثر.
error.FORUM_POLL_BUSY=تعذرت معالجة صوتك الآن، يرجى المحاولة مرة أخرى.
