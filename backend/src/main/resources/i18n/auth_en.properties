# auth modulu ceviri anahtarlari (en). Anahtar duzeni messages.properties ile ayni: error.<KOD>, msg.*, mail.*, notif.*
error.SESSION_REPLACED=Your account was signed in from another device.
error.SESSION_NOT_FOUND=Session not found or already closed.
notif.session.newdevice.title=New device sign-in
notif.session.newdevice.body=Your account was signed in from {0} on {1}. If this was not you, sign that device out from My Devices and change your password.
error.REFRESH_IN_PROGRESS=Your session is being refreshed. Try again in a second; you have not been signed out.
error.PASSWORD_TOO_LONG=The password is too long: at most 72 bytes (Turkish and Arabic characters take more than one byte).
error.PASSWORD_TOO_SHORT=The password must be at least {0} characters.
error.ACCOUNT_NOT_FOUND=No registered account was found for this school number.
error.EMAIL_ALIAS_NOT_ALLOWED=A + tag is not allowed in the email address; enter your address without the tag.
error.EMAIL_FULL_REQUIRED=Enter your full email address, e.g. first.last@example.com
error.PASSWORD_TOO_WEAK=This password is too weak or easy to guess. Use at least {0} characters; common passwords (123456, password1...), your email address, student number or name must not appear in it.
error.REDIS_UNAVAILABLE=The system is temporarily unavailable. Please try again in a few seconds.
error.INTERNAL_ERROR=An unexpected error occurred. Please try again later.
error.METHOD_NOT_ALLOWED=This method is not supported at this address.
error.NOT_ACCEPTABLE=The requested content type cannot be served.
error.UNSUPPORTED_MEDIA_TYPE=Unsupported content type.
error.ADMIN_CANNOT_SELF_DELETE=An administrator cannot delete their own account; another administrator must remove your role first.
error.TWO_FACTOR_REQUIRED=A verification code sent to your e-mail is required to sign in.
error.TWO_FACTOR_CODE_INVALID=The verification code is invalid or has expired.
error.TWO_FACTOR_CHALLENGE_EXPIRED=The verification session has expired. Please sign in again.
error.TWO_FACTOR_ALREADY_ENABLED=Two-factor authentication is already enabled.
error.TWO_FACTOR_NOT_ENABLED=Two-factor authentication is not enabled.
error.INVALID_PASSWORD=Incorrect password.
msg.twofactor.code.sent=A verification code was sent to your e-mail address.
error.TWO_FACTOR_LOCKED=Too many wrong verification codes were entered; sign-in from a new device is locked for 24 hours. You can sign in from a trusted device or reset your password.
notif.twofactor.enabled.title=Two-factor authentication turned on
notif.twofactor.enabled.body=Two-factor authentication was turned on for your account. If this was not you, change your password right away.
notif.twofactor.userdisabled.title=Two-factor authentication turned off
notif.twofactor.userdisabled.body=Two-factor authentication was turned off for your account and your trusted devices were removed. If this was not you, change your password right away.
notif.twofactor.wrongcodes.title=Wrong sign-in verification codes
notif.twofactor.wrongcodes.body=Several wrong verification codes were entered to sign in to your account and sign-in from a new device is locked for 24 hours. If this was not you, change your password.
# QT-BE: deferred email verification when the daily mail quota is exceeded
error.EMAIL_VERIFICATION_REQUIRED=Please verify your email address before doing this.
error.MAIL_QUOTA_EXCEEDED=The daily verification email limit has been reached, please try again tomorrow.
error.EMAIL_ALREADY_VERIFIED=Your email address is already verified.
msg.register.deferred=Your account has been created. We cannot send the verification code right now; you can verify your email later from the Profile page.
msg.verification.sent=A verification code has been sent to your email address.
