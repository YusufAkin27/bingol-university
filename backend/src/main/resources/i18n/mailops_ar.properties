# وحدة mailops (عمليات البريد الإداري: قائمة الحظر والطابور والحصة؛ P13) الترجمات (ar). بدون علامات اقتباس مفردة.
error.MAILOPS_SUPPRESSION_NOT_FOUND=سجل الحظر غير موجود.
error.MAILOPS_EMAIL_INVALID=عنوان البريد الإلكتروني غير صالح.
error.MAILOPS_REASON_INVALID=عند الإضافة اليدوية لا يمكن أن يكون السبب إلا MANUAL.
error.MAILOPS_SUPPRESSION_EXISTS=هذا العنوان موجود بالفعل في قائمة الحظر.
error.MAILOPS_USER_OPTED_OUT=المستخدم ألغى اشتراكه بنفسه ({0}). إذا أزيل هذا السجل فسيتلقى المستخدم الإعلانات من جديد؛ يلزم ترويسة تأكيد وسبب لا يقل عن 20 حرفا.
error.MAILOPS_OUTBOX_NOT_FOUND=سجل الطابور غير موجود.
error.MAILOPS_RETRY_STATE=يمكن إعادة محاولة السجلات الميتة (DEAD) أو المتخطاة (SKIPPED) فقط.
error.MAILOPS_RETRY_STALE_CODE=بريد رمز قديم: الرمز صالح لمدة 10 دقائق فقط. يجب على المستخدم طلب رمز جديد.
error.MAILOPS_RETRY_NO_CONTENT=تم حذف محتوى البريد حفاظا على الخصوصية ولا يمكن إعادة إنشائه.
error.MAILOPS_RETRY_SUPPRESSED=العنوان في قائمة الحظر لذلك لن يعاد إرسال الإعلان.
error.MAILOPS_CANCEL_STATE=يمكن إلغاء السجلات المنتظرة (PENDING/FAILED) فقط.
error.MAILOPS_BULK_INVALID=يجب أن يكون الإجراء الجماعي RETRY أو CANCEL وألا يتجاوز {0} سجلا.
