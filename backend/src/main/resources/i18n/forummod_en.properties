# Kampus Forum ceviri anahtarlari (D moderasyon en). Hata anahtari: error.FORUM_<KOD>; UTF-8, BOM yok.
error.FORUM_DUPLICATE_CONTENT=You cannot post the same content again so soon. Please wait a little.
error.FORUM_MOD_FORBIDDEN=Moderator permission is required for this action.
error.FORUM_MOD_ACTION_INVALID=This action is not valid for this type of content.
error.FORUM_MOD_REASON_REQUIRED=You need to write a reason for this action.
error.FORUM_MOD_REASON_TOO_LONG=The reason can be at most 300 characters.
error.FORUM_MOD_INVALID_STATE=This action cannot be performed in the current state of the content.
error.FORUM_MOD_TARGET_NOT_FOUND=Content not found.
error.FORUM_MOD_BAD_CURSOR=Invalid page cursor.
error.FORUM_MOD_BAD_FILTER=Invalid filter value.
error.FORUM_CANNOT_BLOCK_SELF=You cannot block yourself.
error.FORUM_CANNOT_MUTE_SELF=You cannot mute yourself.
error.FORUM_MUTE_USER_NOT_FOUND=User not found.
error.FORUM_MUTE_LIMIT=You can mute at most {0} users.
