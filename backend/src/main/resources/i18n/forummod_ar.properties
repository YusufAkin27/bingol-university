# Kampus Forum ceviri anahtarlari (D moderasyon ar). Hata anahtari: error.FORUM_<KOD>; UTF-8, BOM yok.
error.FORUM_DUPLICATE_CONTENT=لا يمكنك نشر المحتوى نفسه مرة أخرى بهذه السرعة. يرجى الانتظار قليلاً.
error.FORUM_MOD_FORBIDDEN=يلزم تصريح مشرف لتنفيذ هذا الإجراء.
error.FORUM_MOD_ACTION_INVALID=هذا الإجراء غير صالح لهذا النوع من المحتوى.
error.FORUM_MOD_REASON_REQUIRED=يجب كتابة سبب لهذا الإجراء.
error.FORUM_MOD_REASON_TOO_LONG=يمكن أن يصل السبب إلى 300 حرف كحد أقصى.
error.FORUM_MOD_INVALID_STATE=لا يمكن تنفيذ هذا الإجراء في الحالة الحالية للمحتوى.
error.FORUM_MOD_TARGET_NOT_FOUND=لم يتم العثور على المحتوى.
error.FORUM_MOD_BAD_CURSOR=مؤشر الصفحة غير صالح.
error.FORUM_MOD_BAD_FILTER=قيمة التصفية غير صالحة.
error.FORUM_CANNOT_BLOCK_SELF=لا يمكنك حظر نفسك.
error.FORUM_CANNOT_MUTE_SELF=لا يمكنك كتم نفسك.
error.FORUM_MUTE_USER_NOT_FOUND=لم يتم العثور على المستخدم.
error.FORUM_MUTE_LIMIT=يمكنك كتم {0} مستخدم كحد أقصى.
error.FORUM_MOD_CATEGORY_NOT_FOUND=لم يتم العثور على الفئة.
error.FORUM_MOD_CATEGORY_SLUG_TAKEN=هذا الاسم المختصر مستخدم في فئة أخرى.
error.FORUM_MOD_CATEGORY_SLUG_INVALID=يمكن أن يحتوي الاسم المختصر على أحرف صغيرة وأرقام وشرطات فقط (60 حرفاً كحد أقصى).
error.FORUM_MOD_CATEGORY_NAME_REQUIRED=اسم الفئة مطلوب (80 حرفاً كحد أقصى).
error.FORUM_MOD_CATEGORY_REORDER_INVALID=ترتيب الفئات غير صالح.
error.FORUM_MOD_CATEGORY_LAST_ACTIVE=لا يمكن أرشفة آخر فئة نشطة.
