# E-mail template texts (English).
mail.tpl.brand=BÜ Kampüs
mail.tpl.footer=This message was sent automatically by BÜ Kampüs. Please do not reply to it.

mail.tpl.verification.subject=BÜ Kampüs - E-mail verification code
mail.tpl.verification.title=Verify your e-mail address
mail.tpl.verification.body=Use the verification code below to activate your BÜ Kampüs account.\nThe code is valid for {{minutes}} minutes. If you did not make this request, you can ignore this e-mail.
mail.tpl.verification.code.label=Your verification code

mail.tpl.reset.subject=BÜ Kampüs - Password reset code
mail.tpl.reset.title=Reset your password
mail.tpl.reset.body=Use the code below to reset your password.\nThe code is valid for {{minutes}} minutes. If you did not make this request, ignore this e-mail; your password will not change.
mail.tpl.reset.code.label=Your reset code

mail.tpl.deleted.subject=BÜ Kampüs - Your account was deleted
mail.tpl.deleted.title=Your account was deleted
mail.tpl.deleted.body=Your BÜ Kampüs account was deleted at your request and your personal data was anonymized.\nIf you did not do this, please contact the support team.

mail.tpl.newlogin.subject=BÜ Kampüs - Sign-in from a new device
mail.tpl.newlogin.title=Your account was signed in from a new device
mail.tpl.newlogin.body=Your account was signed in on {{time}} from this device: {{device}}.\nIf this was you, no action is needed. If not, change your password immediately and notify the support team.

mail.tpl.pwchanged.subject=BÜ Kampüs - Your password was changed
mail.tpl.pwchanged.title=Your password was changed
mail.tpl.pwchanged.body=Your account password was changed on {{time}}.\nIf you did not make this change, contact the support team immediately.

mail.tpl.announcement.subject={{heading}}
mail.tpl.announcement.title={{heading}}
mail.tpl.announcement.body={{message}}
