# E-mail template texts (English).
mail.tpl.brand=BÜ Kampüs
mail.tpl.footer=This message was sent automatically by BÜ Kampüs. Please do not reply to it.

mail.tpl.verification.subject=BÜ Kampüs - E-mail verification code
mail.tpl.verification.title=Verify your e-mail address
mail.tpl.verification.body=Use the verification code below to activate your BÜ Kampüs account.\nThe code is valid for {{minutes}} minutes. If you did not make this request, you can ignore this e-mail.
mail.tpl.verification.code.label=Your verification code

mail.tpl.reset.subject=BÜ Kampüs - Password reset code
mail.tpl.reset.title=Reset your password
mail.tpl.reset.body=Use the code below to reset your password.\nThe code is valid for {{minutes}} minutes. If you did not make this request, ignore this e-mail; your password will not change.
mail.tpl.reset.code.label=Your reset code

mail.tpl.twofactor.subject=BÜ Kampüs - Sign-in verification code
mail.tpl.twofactor.title=Verify your sign-in
mail.tpl.twofactor.body=Someone is signing in to your account from an unrecognized device. Use the code below to complete the sign-in.\nThe code is valid for {{minutes}} minutes. If this was not you, do not share the code with anyone and change your password immediately.
mail.tpl.twofactor.code.label=Your sign-in verification code
mail.tpl.supportcode.subject=BÜ Kampüs - Support request verification code
mail.tpl.supportcode.title=Confirm your support request
mail.tpl.supportcode.body=Use the verification code below to confirm your support request.\nThe code is valid for {{minutes}} minutes. If you did not create this request, you can ignore this e-mail.
mail.tpl.supportcode.code.label=Your verification code

mail.tpl.deleted.subject=BÜ Kampüs - Your account was deleted
mail.tpl.deleted.title=Your account was deleted
mail.tpl.deleted.body=Your BÜ Kampüs account was deleted at your request and your personal data was anonymized.\nIf you did not do this, please contact the support team.

mail.tpl.newlogin.subject=BÜ Kampüs - Sign-in from a new device
mail.tpl.newlogin.title=Your account was signed in from a new device
mail.tpl.newlogin.body=Your account was signed in on {{time}} from this device: {{device}}.\nIf this was you, no action is needed. If not, change your password immediately and notify the support team.

mail.tpl.pwchanged.subject=BÜ Kampüs - Your password was changed
mail.tpl.pwchanged.title=Your password was changed
mail.tpl.pwchanged.body=Your account password was changed on {{time}}.\nIf you did not make this change, contact the support team immediately.

mail.tpl.tfnotice.subject=BÜ Kampüs - Account security notice
mail.tpl.tfnotice.title=Account security notice
mail.tpl.tfnotice.body={{message}}
mail.twofactor.enabled=Two-factor authentication was turned on for your account on {0}.\nIf you did not do this, change your password right away and tell the support team.
mail.twofactor.userdisabled=Two-factor authentication was turned off for your account on {0} and your trusted devices were removed.\nIf you did not do this, change your password right away and tell the support team.
mail.twofactor.disabled=As part of account recovery an administrator turned off two-factor authentication on {0}; your trusted devices were removed and your sessions were closed.\nFor your security we recommend changing your password and turning two-factor authentication back on. If you did not request this, tell the support team.
mail.twofactor.wrongcodes=Several wrong verification codes were entered to sign in to your account on {0}; sign-in from a new device is locked for 24 hours.\nIf this was not you, change your password right away.
mail.tpl.announcement.subject={{heading}}
mail.tpl.announcement.title={{heading}}
mail.tpl.announcement.body={{message}}

mail.tpl.unsubscribe.text=To stop receiving announcements like this, unsubscribe:

mail.unsub.confirm.title=Unsubscribe
mail.unsub.confirm.body=Press the button below to stop BÜ Kampüs announcement emails to this address.
mail.unsub.confirm.button=Unsubscribe
mail.unsub.done.title=You are unsubscribed
mail.unsub.done.body=BÜ Kampüs will no longer send announcement emails to this address.
mail.unsub.invalid.title=Invalid link
mail.unsub.invalid.body=This link is invalid or has expired. Please use the link in a more recent email.
mail.unsub.note=Verification codes, password reset and security emails are still sent to protect your account.
