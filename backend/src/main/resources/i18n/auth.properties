notif.twofactor.enabled.title=İki faktörlü doğrulama açıldı
notif.twofactor.enabled.body=Hesabınızda iki faktörlü doğrulama açıldı. Bunu siz yapmadıysanız şifrenizi hemen değiştirin.
notif.twofactor.userdisabled.title=İki faktörlü doğrulama kapatıldı
notif.twofactor.userdisabled.body=Hesabınızda iki faktörlü doğrulama kapatıldı ve güvenilen cihazlarınız silindi. Bunu siz yapmadıysanız şifrenizi hemen değiştirin.
