# auth modulu ceviri anahtarlari (tr). Anahtar duzeni messages.properties ile ayni: error.<KOD>, msg.*, mail.*, notif.*
error.SESSION_REPLACED=Hesabınıza başka bir cihazdan giriş yapıldı.
error.PASSWORD_TOO_LONG=Şifre çok uzun: en fazla 72 bayt olabilir (Türkçe ve Arapça karakterler birden çok bayt tutar).
error.EMAIL_ALIAS_NOT_ALLOWED=E-posta adresinde + etiketi kullanılamaz; adresinizi etiketsiz yazın.
error.EMAIL_FULL_REQUIRED=Okul e-posta adresinizin tamamını yazın, örn. ad.soyad@bingol.edu.tr
error.PASSWORD_TOO_WEAK=Bu şifre çok zayıf veya tahmin edilebilir. En az {0} karakter kullanın; yaygın şifreler (123456, sifre1234...), e-posta adresiniz, okul numaranız ya da adınız şifrede geçmemelidir.
error.REDIS_UNAVAILABLE=Sistem geçici olarak kullanılamıyor. Lütfen birkaç saniye sonra tekrar deneyin.
error.INTERNAL_ERROR=Beklenmeyen bir hata oluştu. Lütfen daha sonra tekrar deneyin.
error.METHOD_NOT_ALLOWED=Bu yöntem bu adreste desteklenmiyor.
error.NOT_ACCEPTABLE=İstenen içerik türü sunulamıyor.
error.UNSUPPORTED_MEDIA_TYPE=Desteklenmeyen içerik türü.
error.ADMIN_CANNOT_SELF_DELETE=Yönetici hesabı kendi kendini silemez; önce başka bir yönetici rolünüzü kaldırmalıdır.
error.TWO_FACTOR_REQUIRED=Giriş için e-postanıza gönderilen doğrulama kodu gerekli.
error.TWO_FACTOR_CODE_INVALID=Doğrulama kodu geçersiz veya süresi dolmuş.
error.TWO_FACTOR_CHALLENGE_EXPIRED=Doğrulama oturumunun süresi doldu. Lütfen tekrar giriş yapın.
error.TWO_FACTOR_ALREADY_ENABLED=İki faktörlü doğrulama zaten açık.
error.TWO_FACTOR_NOT_ENABLED=İki faktörlü doğrulama açık değil.
error.INVALID_PASSWORD=Şifre hatalı.
msg.twofactor.code.sent=Doğrulama kodu e-posta adresinize gönderildi.
error.TWO_FACTOR_LOCKED=Çok sayıda hatalı doğrulama kodu girildi; yeni cihazdan giriş 24 saat kilitlendi. Güvenilen bir cihazdan girebilir ya da şifrenizi sıfırlayabilirsiniz.
notif.twofactor.enabled.title=İki faktörlü doğrulama açıldı
notif.twofactor.enabled.body=Hesabınızda iki faktörlü doğrulama açıldı. Bunu siz yapmadıysanız şifrenizi hemen değiştirin.
notif.twofactor.userdisabled.title=İki faktörlü doğrulama kapatıldı
notif.twofactor.userdisabled.body=Hesabınızda iki faktörlü doğrulama kapatıldı ve güvenilen cihazlarınız silindi. Bunu siz yapmadıysanız şifrenizi hemen değiştirin.
notif.twofactor.wrongcodes.title=Hatalı giriş doğrulama kodları
notif.twofactor.wrongcodes.body=Hesabınıza giriş için üst üste hatalı doğrulama kodu girildi ve yeni cihazdan giriş 24 saat kilitlendi. Bu siz değilseniz şifrenizi değiştirin.
