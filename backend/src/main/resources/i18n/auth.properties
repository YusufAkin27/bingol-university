# auth modulu ceviri anahtarlari (tr). Anahtar duzeni messages.properties ile ayni: error.<KOD>, msg.*, mail.*, notif.*
error.SESSION_REPLACED=Hesabınıza başka bir cihazdan giriş yapıldı.
error.PASSWORD_TOO_LONG=Şifre çok uzun: en fazla 72 bayt olabilir (Türkçe ve Arapça karakterler birden çok bayt tutar).
error.EMAIL_ALIAS_NOT_ALLOWED=E-posta adresinde + etiketi kullanılamaz; adresinizi etiketsiz yazın.
error.EMAIL_FULL_REQUIRED=Okul e-posta adresinizin tamamını yazın, örn. ad.soyad@bingol.edu.tr
error.PASSWORD_TOO_WEAK=Bu şifre çok zayıf veya tahmin edilebilir. En az {0} karakter kullanın; yaygın şifreler (123456, sifre1234...), e-posta adresiniz, okul numaranız ya da adınız şifrede geçmemelidir.
error.REDIS_UNAVAILABLE=Sistem geçici olarak kullanılamıyor. Lütfen birkaç saniye sonra tekrar deneyin.
error.INTERNAL_ERROR=Beklenmeyen bir hata oluştu. Lütfen daha sonra tekrar deneyin.
error.METHOD_NOT_ALLOWED=Bu yöntem bu adreste desteklenmiyor.
error.NOT_ACCEPTABLE=İstenen içerik türü sunulamıyor.
error.UNSUPPORTED_MEDIA_TYPE=Desteklenmeyen içerik türü.
error.ADMIN_CANNOT_SELF_DELETE=Yönetici hesabı kendi kendini silemez; önce başka bir yönetici rolünüzü kaldırmalıdır.
