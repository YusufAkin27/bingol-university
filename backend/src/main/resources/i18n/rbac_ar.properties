# وحدة rbac (مصفوفة أدوار وصلاحيات المشرفين؛ P16) ترجمات (ar). بلا علامات اقتباس مفردة.
error.ADMIN_PERMISSION_DENIED=ليست لديك صلاحية لهذا الإجراء (الصلاحية المطلوبة: {0}). اطلب من مشرف FULL تغيير ملفك الإداري.
error.RBAC_SELF_CHANGE=لا يمكنك تغيير ملفك الإداري بنفسك.
error.RBAC_TARGET_NOT_ADMIN=الحساب المستهدف ليس مشرفا؛ اجعل دوره ADMIN أولا.
error.RBAC_NO_CHANGE=المشرف يملك هذا الملف بالفعل.
error.RBAC_LAST_FULL=لا يمكن خفض آخر مشرف FULL.
error.RBAC_APPROVAL_REQUIRED=خفض مشرف FULL أو جعل شخص FULL يتطلب موافقة شخصين؛ أنشئ اقتراح تغيير.
error.RBAC_APPROVAL_NOT_NEEDED=هذا التغيير لا يتطلب موافقة؛ عيّن الملف مباشرة.
error.RBAC_CHANGE_PENDING=يوجد اقتراح تغيير قيد الانتظار لهذا المشرف.
error.RBAC_CHANGE_NOT_FOUND=اقتراح التغيير غير موجود.
error.RBAC_CHANGE_DECIDED=تم البت في هذا الاقتراح بالفعل.
error.RBAC_CHANGE_EXPIRED=انتهت صلاحية الاقتراح (24 ساعة)؛ أنشئ اقتراحا جديدا.
error.RBAC_SAME_APPROVER=صاحب الاقتراح لا يمكنه الموافقة؛ يلزم مشرف FULL ثان.
error.RBAC_CHANGE_STALE=تغيّر ملف الهدف بعد الاقتراح؛ أنشئ اقتراحا جديدا.
error.ADMIN_PATH_INVALID=يحتوي مسار الإدارة على حرف مُرمَّز غير صالح.
error.ADMIN_TARGET_FORBIDDEN=لا يمكن إلا لمشرف FULL التعامل مع حساب مشرف.
error.VERIFY_ADMIN_EMAIL_FORBIDDEN=هذا البريد مدرج في ADMIN_EMAILS؛ لا يمكن توثيق حسابات المشرفين إلا برمز البريد الإلكتروني.
error.REASON_INVALID=لا يجوز أن يحتوي السبب على فواصل أسطر أو أحرف تحكم.
