mail.twofactor.disabled=أوقف أحد المسؤولين التحقق بخطوتين بتاريخ {0} ضمن استعادة الحساب؛ حُذفت أجهزتك الموثوقة وأُغلقت جلساتك.\nحفاظًا على أمانك ننصحك بتغيير كلمة المرور وإعادة تفعيل التحقق بخطوتين. إذا لم تطلب ذلك فأبلغ فريق الدعم.
mail.twofactor.wrongcodes=أُدخلت عدة رموز تحقق خاطئة لتسجيل الدخول إلى حسابك بتاريخ {0}؛ تم قفل الدخول من جهاز جديد لمدة 24 ساعة.\nإذا لم تكن أنت، فغيّر كلمة المرور فورًا.
