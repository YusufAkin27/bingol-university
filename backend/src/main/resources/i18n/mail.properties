# E-posta sablon metinleri (Turkce, varsayilan). {{ad}} yer tutuculari MailRenderer tarafindan doldurulur.
mail.tpl.brand=BÜ Kampüs
mail.tpl.footer=Bu ileti BÜ Kampüs tarafından otomatik gönderilmiştir. Lütfen bu iletiyi yanıtlamayın.

