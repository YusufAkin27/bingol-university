mail.tpl.reset.code.label=Sıfırlama kodunuz

mail.tpl.twofactor.subject=BÜ Kampüs - Giriş doğrulama kodu
mail.tpl.twofactor.title=Girişinizi doğrulayın
mail.tpl.twofactor.body=Hesabınıza tanınmayan bir cihazdan giriş yapılıyor. Girişi tamamlamak için aşağıdaki kodu kullanın.\nKod {{minutes}} dakika geçerlidir. Bu girişi siz yapmadıysanız kodu kimseyle paylaşmayın ve şifrenizi hemen değiştirin.
mail.tpl.twofactor.code.label=Giriş doğrulama kodunuz
mail.tpl.supportcode.subject=BÜ Kampüs - Destek talebi doğrulama kodu
mail.tpl.supportcode.title=Destek talebinizi onaylayın
mail.tpl.supportcode.body=Destek talebinizi onaylamak için aşağıdaki doğrulama kodunu kullanın.\nKod {{minutes}} dakika geçerlidir. Bu talebi siz oluşturmadıysanız bu e-postayı yok sayabilirsiniz.
mail.tpl.supportcode.code.label=Doğrulama kodunuz

mail.tpl.deleted.subject=BÜ Kampüs - Hesabınız silindi
mail.tpl.deleted.title=Hesabınız silindi
mail.tpl.deleted.body=BÜ Kampüs hesabınız talebiniz üzerine silindi ve kişisel verileriniz anonimleştirildi.\nBu işlemi siz yapmadıysanız lütfen destek ekibiyle iletişime geçin.

mail.tpl.newlogin.subject=BÜ Kampüs - Yeni cihazdan giriş
mail.tpl.newlogin.title=Hesabınıza yeni bir cihazdan giriş yapıldı
mail.tpl.newlogin.body=Hesabınıza {{time}} tarihinde şu cihazdan giriş yapıldı: {{device}}.\nBu sizseniz bir işlem yapmanız gerekmez. Siz değilseniz şifrenizi hemen değiştirin ve destek ekibine bildirin.

mail.tpl.pwchanged.subject=BÜ Kampüs - Şifreniz değiştirildi
mail.tpl.pwchanged.title=Şifreniz değiştirildi
mail.tpl.pwchanged.body=Hesabınızın şifresi {{time}} tarihinde değiştirildi.\nBu değişikliği siz yapmadıysanız hemen destek ekibiyle iletişime geçin.

mail.tpl.tfnotice.subject=BÜ Kampüs - Hesap güvenliği bildirimi
mail.tpl.tfnotice.title=Hesap güvenliği bildirimi
mail.tpl.tfnotice.body={{message}}
mail.twofactor.enabled=Hesabınızda {0} tarihinde iki faktörlü doğrulama açıldı.\nBunu siz yapmadıysanız şifrenizi hemen değiştirin ve destek ekibine bildirin.
mail.twofactor.userdisabled=Hesabınızda {0} tarihinde iki faktörlü doğrulama kapatıldı ve güvenilen cihazlarınız silindi.\nBunu siz yapmadıysanız şifrenizi hemen değiştirin ve destek ekibine bildirin.
mail.twofactor.disabled=Hesap kurtarma kapsamında bir yönetici {0} tarihinde iki faktörlü doğrulamayı kapattı; güvenilen cihazlarınız silindi ve oturumlarınız kapatıldı.\nGüvenliğiniz için şifrenizi değiştirmenizi ve iki faktörlü doğrulamayı yeniden açmanızı öneririz. Bu talebi siz yapmadıysanız destek ekibine bildirin.
mail.twofactor.wrongcodes=Hesabınıza giriş için {0} tarihinde üst üste hatalı doğrulama kodu girildi; yeni cihazdan giriş 24 saat kilitlendi.\nBu siz değilseniz şifrenizi hemen değiştirin.
