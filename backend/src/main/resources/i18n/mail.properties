# E-posta sablon metinleri (Turkce, varsayilan). {{ad}} yer tutuculari MailRenderer tarafindan doldurulur.
mail.tpl.brand=BÜ Kampüs
mail.tpl.footer=Bu ileti BÜ Kampüs tarafından otomatik gönderilmiştir. Lütfen bu iletiyi yanıtlamayın.

mail.tpl.verification.subject=BÜ Kampüs - E-posta doğrulama kodu
mail.tpl.verification.title=E-posta adresinizi doğrulayın
mail.tpl.verification.body=BÜ Kampüs hesabınızı etkinleştirmek için aşağıdaki doğrulama kodunu kullanın.\nKod {{minutes}} dakika geçerlidir. Bu işlemi siz yapmadıysanız bu e-postayı yok sayabilirsiniz.
mail.tpl.verification.code.label=Doğrulama kodunuz

mail.tpl.reset.subject=BÜ Kampüs - Şifre sıfırlama kodu
mail.tpl.reset.title=Şifrenizi sıfırlayın
mail.tpl.reset.body=Şifrenizi sıfırlamak için aşağıdaki kodu kullanın.\nKod {{minutes}} dakika geçerlidir. Bu isteği siz yapmadıysanız bu e-postayı yok sayın; şifreniz değişmeyecektir.
mail.tpl.reset.code.label=Sıfırlama kodunuz

mail.tpl.deleted.subject=BÜ Kampüs - Hesabınız silindi
mail.tpl.deleted.title=Hesabınız silindi
mail.tpl.deleted.body=BÜ Kampüs hesabınız talebiniz üzerine silindi ve kişisel verileriniz anonimleştirildi.\nBu işlemi siz yapmadıysanız lütfen destek ekibiyle iletişime geçin.

mail.tpl.newlogin.subject=BÜ Kampüs - Yeni cihazdan giriş
mail.tpl.newlogin.title=Hesabınıza yeni bir cihazdan giriş yapıldı
mail.tpl.newlogin.body=Hesabınıza {{time}} tarihinde şu cihazdan giriş yapıldı: {{device}}.\nBu sizseniz bir işlem yapmanız gerekmez. Siz değilseniz şifrenizi hemen değiştirin ve destek ekibine bildirin.

mail.tpl.pwchanged.subject=BÜ Kampüs - Şifreniz değiştirildi
mail.tpl.pwchanged.title=Şifreniz değiştirildi
mail.tpl.pwchanged.body=Hesabınızın şifresi {{time}} tarihinde değiştirildi.\nBu değişikliği siz yapmadıysanız hemen destek ekibiyle iletişime geçin.

mail.tpl.announcement.subject={{heading}}
mail.tpl.announcement.title={{heading}}
mail.tpl.announcement.body={{message}}

mail.tpl.unsubscribe.text=Bu tür duyuruları almak istemiyorsanız abonelikten çıkın:

mail.unsub.confirm.title=Abonelikten çık
mail.unsub.confirm.body=BÜ Kampüs duyuru e-postalarını bu adrese göndermeyi durdurmak için aşağıdaki düğmeye basın.
mail.unsub.confirm.button=Abonelikten çık
mail.unsub.done.title=Abonelikten çıktınız
mail.unsub.done.body=Bu adrese artık BÜ Kampüs duyuru e-postaları gönderilmeyecek.
mail.unsub.invalid.title=Bağlantı geçersiz
mail.unsub.invalid.body=Bu bağlantı geçersiz veya süresi dolmuş. Lütfen yeni bir e-postadaki bağlantıyı kullanın.
mail.unsub.note=Doğrulama kodu, şifre sıfırlama ve güvenlik e-postaları hesabınızın güvenliği için gönderilmeye devam eder.
