# ops modulu ceviri anahtarlari (ar). Anahtar duzeni messages.properties ile ayni: error.<KOD>, msg.*, mail.*, notif.*

# حظر الوصول (حظر IP/CIDR/الجهاز/المستخدم من لوحة الإدارة)
error.ACCESS_BLOCKED=تم إغلاق الوصول من هذا الجهاز أو الشبكة.
error.BAN_SELF_LOCKOUT=قد يؤدي هذا الحظر إلى إغلاق الوصول عليك أو على شبكة الإدارة؛ تم رفض العملية.
error.BAN_INVALID_VALUE=قيمة الحظر غير صالحة.
