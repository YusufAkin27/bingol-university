# auth modulu ceviri anahtarlari (ar). Anahtar duzeni messages.properties ile ayni: error.<KOD>, msg.*, mail.*, notif.*
error.SESSION_REPLACED=تم تسجيل الدخول إلى حسابك من جهاز آخر.
notif.session.newdevice.title=تسجيل دخول من جهاز جديد
notif.session.newdevice.body=تم تسجيل الدخول إلى حسابك من {0} في {1}. إذا لم تكن أنت، فاخرج من ذلك الجهاز من قسم أجهزتي وغيّر كلمة المرور.
error.REFRESH_IN_PROGRESS=جارٍ تجديد الجلسة. أعد المحاولة بعد ثانية؛ لم يتم تسجيل خروجك.
error.PASSWORD_TOO_LONG=كلمة المرور طويلة جدا: الحد الأقصى 72 بايت (الأحرف التركية والعربية تشغل أكثر من بايت واحد).
error.PASSWORD_TOO_SHORT=يجب أن تتكون كلمة المرور من {0} أحرف على الأقل.
error.ACCOUNT_NOT_FOUND=لم يتم العثور على حساب مسجل لعنوان البريد الإلكتروني هذا.
error.EMAIL_ALIAS_NOT_ALLOWED=لا يمكن استخدام وسم + في عنوان البريد الإلكتروني؛ أدخل عنوانك بدون الوسم.
error.EMAIL_FULL_REQUIRED=أدخل عنوان بريدك الإلكتروني كاملاً، مثل name.surname@example.com
error.PASSWORD_TOO_WEAK=كلمة المرور هذه ضعيفة جدا أو سهلة التخمين. استخدم {0} أحرف على الأقل، ولا تضع فيها كلمات مرور شائعة (123456 وغيرها) أو بريدك الإلكتروني أو رقمك الجامعي أو اسمك.
error.REDIS_UNAVAILABLE=النظام غير متاح مؤقتا. يرجى المحاولة مرة أخرى بعد بضع ثوان.
error.INTERNAL_ERROR=حدث خطأ غير متوقع. يرجى المحاولة لاحقا.
error.METHOD_NOT_ALLOWED=هذه الطريقة غير مدعومة في هذا العنوان.
error.NOT_ACCEPTABLE=لا يمكن تقديم نوع المحتوى المطلوب.
error.UNSUPPORTED_MEDIA_TYPE=نوع المحتوى غير مدعوم.
error.ADMIN_CANNOT_SELF_DELETE=لا يمكن للمسؤول حذف حسابه بنفسه؛ يجب أن يزيل مسؤول آخر دورك أولا.
error.TWO_FACTOR_REQUIRED=يلزم رمز التحقق المُرسل إلى بريدك الإلكتروني لتسجيل الدخول.
error.TWO_FACTOR_CODE_INVALID=رمز التحقق غير صالح أو انتهت صلاحيته.
error.TWO_FACTOR_CHALLENGE_EXPIRED=انتهت صلاحية جلسة التحقق. يرجى تسجيل الدخول مرة أخرى.
error.TWO_FACTOR_ALREADY_ENABLED=التحقق بخطوتين مفعّل بالفعل.
error.TWO_FACTOR_NOT_ENABLED=التحقق بخطوتين غير مفعّل.
error.INVALID_PASSWORD=كلمة المرور غير صحيحة.
msg.twofactor.code.sent=تم إرسال رمز التحقق إلى بريدك الإلكتروني.
error.TWO_FACTOR_LOCKED=تم إدخال عدد كبير من رموز التحقق الخاطئة؛ تم قفل تسجيل الدخول من جهاز جديد لمدة 24 ساعة. يمكنك الدخول من جهاز موثوق أو إعادة تعيين كلمة المرور.
notif.twofactor.enabled.title=تم تفعيل التحقق بخطوتين
notif.twofactor.enabled.body=تم تفعيل التحقق بخطوتين لحسابك. إذا لم تكن أنت، فغيّر كلمة المرور فورًا.
notif.twofactor.userdisabled.title=تم إيقاف التحقق بخطوتين
notif.twofactor.userdisabled.body=تم إيقاف التحقق بخطوتين لحسابك وحُذفت أجهزتك الموثوقة. إذا لم تكن أنت، فغيّر كلمة المرور فورًا.
notif.twofactor.wrongcodes.title=رموز تحقق خاطئة عند الدخول
notif.twofactor.wrongcodes.body=أُدخلت عدة رموز تحقق خاطئة لتسجيل الدخول إلى حسابك وتم قفل الدخول من جهاز جديد لمدة 24 ساعة. إذا لم تكن أنت، فغيّر كلمة المرور.
# QT-BE: التحقق المؤجل من البريد
error.EMAIL_VERIFICATION_REQUIRED=يرجى تأكيد بريدك الإلكتروني أولًا لإجراء هذا الإجراء.
error.MAIL_QUOTA_EXCEEDED=تم بلوغ الحد اليومي لرسائل التحقق، يرجى المحاولة غدًا.
error.EMAIL_ALREADY_VERIFIED=تم تأكيد بريدك الإلكتروني مسبقًا.
msg.register.deferred=تم إنشاء حسابك. لا يمكننا إرسال رمز التحقق حاليًا؛ يمكنك تأكيد بريدك لاحقًا من صفحة الملف الشخصي.
msg.verification.sent=تم إرسال رمز التحقق إلى بريدك الإلكتروني.
# تسجيل الدخول عبر Google / Apple وإكمال الملف الشخصي (OAUTH)
error.OAUTH_DISABLED=طريقة تسجيل الدخول هذه غير متاحة حاليًا.
error.OAUTH_TOKEN_INVALID=تعذّر التحقق من تسجيل الدخول. يرجى المحاولة مرة أخرى.
error.OAUTH_EMAIL_UNVERIFIED=عنوان البريد الإلكتروني لهذا الحساب غير موثّق لدى المزوّد. وثّق بريدك الإلكتروني أولًا.
error.OAUTH_EMAIL_MISSING=تعذّر الحصول على عنوان بريد إلكتروني من حسابك. اسمح بمشاركة البريد عند الدخول عبر Apple أو اختر طريقة أخرى.
error.OAUTH_LINK_REQUIRED=يوجد حساب مسجّل بهذا البريد الإلكتروني. سجّل الدخول أولًا ببريدك وكلمة المرور ثم اربط هذا الحساب.
error.OAUTH_IDENTITY_TAKEN=هذا الحساب مرتبط بمستخدم آخر.
error.OAUTH_PROVIDER_ALREADY_LINKED=هناك هوية مرتبطة بالفعل بحسابك لهذا المزوّد.
error.OAUTH_IDENTITY_NOT_FOUND=هذا المزوّد غير مرتبط بحسابك.
error.OAUTH_LAST_LOGIN_METHOD=هذه هي طريقة تسجيل الدخول الوحيدة في حسابك. عيّن كلمة مرور أو اربط مزوّدًا آخر أولًا.
error.OAUTH_REAUTH_REQUIRED=يلزم إعادة التحقق باستخدام حسابك المرتبط لهذا الإجراء.
error.PROFILE_INCOMPLETE=أكمل ملفك الشخصي قبل المتابعة.
error.REAL_EMAIL_REQUIRED=أضف بريدك الإلكتروني الحقيقي والنشط وتحقّق منه قبل المتابعة.
error.EMAIL_UNCHANGED=هذا هو عنوان البريد الإلكتروني الحالي لحسابك بالفعل.
error.EMAIL_RELAY_NOT_ALLOWED=لا يمكن استخدام عنوان مخفي (مؤقت)؛ أدخل عنوان بريدك الإلكتروني الحقيقي الذي تستخدمه فعلًا.
error.EMAIL_UNAVAILABLE=لا يمكن استخدام عنوان البريد الإلكتروني هذا. جرّب عنوانًا آخر أو سجّل الدخول إلى الحساب المفتوح به.
error.EMAIL_CHANGE_NOT_ALLOWED=لا يمكن تغيير البريد الإلكتروني لهذا الحساب من هنا.
