# auth modulu ceviri anahtarlari (ar). Anahtar duzeni messages.properties ile ayni: error.<KOD>, msg.*, mail.*, notif.*
error.SESSION_REPLACED=تم تسجيل الدخول إلى حسابك من جهاز آخر.
error.REFRESH_IN_PROGRESS=جارٍ تجديد الجلسة. أعد المحاولة بعد ثانية؛ لم يتم تسجيل خروجك.
error.PASSWORD_TOO_LONG=كلمة المرور طويلة جدا: الحد الأقصى 72 بايت (الأحرف التركية والعربية تشغل أكثر من بايت واحد).
error.EMAIL_ALIAS_NOT_ALLOWED=لا يمكن استخدام وسم + في عنوان البريد الإلكتروني؛ أدخل عنوانك بدون الوسم.
error.EMAIL_FULL_REQUIRED=أدخل عنوان بريدك الإلكتروني الجامعي كاملاً، مثل name.surname@bingol.edu.tr
error.PASSWORD_TOO_WEAK=كلمة المرور هذه ضعيفة جدا أو سهلة التخمين. استخدم {0} أحرف على الأقل، ولا تضع فيها كلمات مرور شائعة (123456 وغيرها) أو بريدك الإلكتروني أو رقمك الجامعي أو اسمك.
error.REDIS_UNAVAILABLE=النظام غير متاح مؤقتا. يرجى المحاولة مرة أخرى بعد بضع ثوان.
error.INTERNAL_ERROR=حدث خطأ غير متوقع. يرجى المحاولة لاحقا.
error.METHOD_NOT_ALLOWED=هذه الطريقة غير مدعومة في هذا العنوان.
error.NOT_ACCEPTABLE=لا يمكن تقديم نوع المحتوى المطلوب.
error.UNSUPPORTED_MEDIA_TYPE=نوع المحتوى غير مدعوم.
error.ADMIN_CANNOT_SELF_DELETE=لا يمكن للمسؤول حذف حسابه بنفسه؛ يجب أن يزيل مسؤول آخر دورك أولا.
error.TWO_FACTOR_REQUIRED=يلزم رمز التحقق المُرسل إلى بريدك الإلكتروني لتسجيل الدخول.
error.TWO_FACTOR_CODE_INVALID=رمز التحقق غير صالح أو انتهت صلاحيته.
error.TWO_FACTOR_CHALLENGE_EXPIRED=انتهت صلاحية جلسة التحقق. يرجى تسجيل الدخول مرة أخرى.
error.TWO_FACTOR_ALREADY_ENABLED=التحقق بخطوتين مفعّل بالفعل.
error.TWO_FACTOR_NOT_ENABLED=التحقق بخطوتين غير مفعّل.
error.INVALID_PASSWORD=كلمة المرور غير صحيحة.
msg.twofactor.code.sent=تم إرسال رمز التحقق إلى بريدك الإلكتروني.
error.TWO_FACTOR_LOCKED=تم إدخال عدد كبير من رموز التحقق الخاطئة؛ تم قفل تسجيل الدخول من جهاز جديد لمدة 24 ساعة. يمكنك الدخول من جهاز موثوق أو إعادة تعيين كلمة المرور.
notif.twofactor.enabled.title=تم تفعيل التحقق بخطوتين
