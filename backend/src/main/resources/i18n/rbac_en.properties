# rbac module (admin role and permission matrix; P16) translations (en). No apostrophes.
error.ADMIN_PERMISSION_DENIED=You do not have permission for this action (required permission: {0}). Ask a FULL administrator to change your admin profile.
error.RBAC_SELF_CHANGE=You cannot change your own admin profile.
error.RBAC_TARGET_NOT_ADMIN=The target account is not an administrator; set its role to ADMIN first.
error.RBAC_NO_CHANGE=The administrator already has this profile.
error.RBAC_LAST_FULL=The last FULL administrator cannot be demoted.
error.RBAC_APPROVAL_REQUIRED=Demoting a FULL administrator or making someone FULL needs two-person approval; create a change proposal.
error.RBAC_APPROVAL_NOT_NEEDED=This change needs no approval; assign the profile directly.
error.RBAC_CHANGE_PENDING=There is already a pending change proposal for this administrator.
error.RBAC_CHANGE_NOT_FOUND=Change proposal not found.
error.RBAC_CHANGE_DECIDED=This proposal has already been decided.
error.RBAC_CHANGE_EXPIRED=The proposal has expired (24 hours); create a new one.
error.RBAC_SAME_APPROVER=The proposer cannot approve; a second FULL administrator is required.
error.RBAC_CHANGE_STALE=The target profile changed after the proposal; create a new proposal.
error.ADMIN_PATH_INVALID=The admin path contains an invalid encoded character.
error.ADMIN_TARGET_FORBIDDEN=Only a FULL administrator can act on an administrator account.
error.VERIFY_ADMIN_EMAIL_FORBIDDEN=This email is listed in ADMIN_EMAILS; administrator accounts can only be verified with the email code.
error.REASON_INVALID=The reason cannot contain line breaks or control characters.
