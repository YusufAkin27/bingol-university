<!DOCTYPE html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>{{title}}</title>
<style>
@media (prefers-color-scheme: dark) {
  .bg { background-color: #12151f !important; }
  .card { background-color: #1c2133 !important; }
  .txt { color: #f1ece8 !important; }
  .muted { color: #b9b4b0 !important; }
  .code { background-color: #12151f !important; color: #ffffff !important; }
}
</style>
</head>
<body class="bg" style="margin:0;padding:0;background-color:#FAF6F3;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="bg" style="background-color:#FAF6F3;">
<tr><td align="center" style="padding:24px 12px;">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" class="card" style="width:100%;max-width:600px;background-color:#ffffff;border-radius:8px;overflow:hidden;">
<tr><td style="background-color:#C62A20;padding:20px 28px;font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:bold;color:#ffffff;">{{brand}}</td></tr>
<tr><td class="txt" style="padding:28px;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.6;color:#171E33;">
<h1 class="txt" style="margin:0 0 16px 0;font-size:22px;line-height:1.3;color:#171E33;">{{title}}</h1>
{{{bodyHtml}}}
{{{codeHtml}}}
</td></tr>
<tr><td class="muted" style="padding:16px 28px 24px 28px;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.5;color:#6b6f80;border-top:1px solid #eee4de;">{{footer}}</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
