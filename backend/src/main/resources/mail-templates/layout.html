<!DOCTYPE html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="x-apple-disable-message-reformatting">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no, url=no">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>{{title}}</title>
<!--[if mso]>
<style>
body, table, td, p, a, h1 { font-family: Arial, Helvetica, sans-serif !important; }
</style>
<![endif]-->
<style>
:root { color-scheme: light dark; supported-color-schemes: light dark; }
body { margin: 0; padding: 0; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
img { -ms-interpolation-mode: bicubic; }
h1, h2, h3, h4, h5, h6, th, b, strong { font-weight: 400; }
.content p { margin: 0 0 16px 0; }
.content a { color: #09090B; text-decoration: underline; }
@media only screen and (max-width: 620px) {
  .px { padding-left: 20px !important; padding-right: 20px !important; }
  .code-text { font-size: 28px !important; letter-spacing: 6px !important; }
  .outer { padding: 16px 8px !important; }
}
@media (prefers-color-scheme: dark) {
  body, .bg { background-color: #09090B !important; }
  .card { background-color: #141416 !important; border-color: #303034 !important; }
  .txt { color: #FAFAFA !important; }
  .body-txt { color: #E4E4E7 !important; }
  .muted { color: #A1A1AA !important; }
  .hair { border-color: #303034 !important; }
  .codebox { background-color: #09090B !important; border-color: #3F3F46 !important; }
  .note { border-color: #303034 !important; }
  .btn { background-color: #FFFFFF !important; border-color: #FFFFFF !important; }
  .content a, .link { color: #FAFAFA !important; }
  .content a.btn-a, .btn-a { color: #09090B !important; }
  .content [style*="#09090B"] { color: #FAFAFA !important; }
  .logo-light { display: none !important; }
  .logo-dark { display: block !important; max-height: none !important; overflow: visible !important; }
}
[data-ogsc] .bg { background-color: #09090B !important; }
[data-ogsc] .card { background-color: #141416 !important; border-color: #303034 !important; }
[data-ogsc] .txt { color: #FAFAFA !important; }
[data-ogsc] .body-txt { color: #E4E4E7 !important; }
[data-ogsc] .muted { color: #A1A1AA !important; }
[data-ogsc] .btn { background-color: #FFFFFF !important; }
[data-ogsc] .btn-a { color: #09090B !important; }
</style>
</head>
<body class="bg" dir="{{dir}}" style="margin:0;padding:0;background-color:#F4F4F5;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="bg" bgcolor="#F4F4F5" style="background-color:#F4F4F5;">
<tr><td class="outer" align="center" style="padding:32px 12px;">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" dir="{{dir}}" class="card" bgcolor="#FFFFFF" style="width:100%;max-width:600px;background-color:#FFFFFF;border:1px solid #E4E4E7;border-radius:12px;border-collapse:separate;">
<tr><td class="px" dir="{{dir}}" align="{{align}}" style="padding:28px 32px 20px 32px;text-align:{{align}};">{{{headerHtml}}}</td></tr>
<tr><td class="px" style="padding:0 32px;"><div class="hair" style="border-top:1px solid #E4E4E7;font-size:0;line-height:0;height:0;">&nbsp;</div></td></tr>
<tr><td class="px content body-txt" dir="{{dir}}" align="{{align}}" style="padding:28px 32px 12px 32px;text-align:{{align}};font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#27272A;word-break:break-word;overflow-wrap:anywhere;">
<h1 class="txt" style="margin:0 0 20px 0;font-size:26px;line-height:1.25;font-weight:400;color:#09090B;word-break:break-word;overflow-wrap:anywhere;">{{title}}</h1>
{{{contentHtml}}}
</td></tr>
<tr><td class="px" style="padding:12px 32px 0 32px;"><div class="hair" style="border-top:1px solid #E4E4E7;font-size:0;line-height:0;height:0;">&nbsp;</div></td></tr>
<tr><td class="px muted" dir="{{dir}}" align="{{align}}" style="padding:20px 32px 28px 32px;text-align:{{align}};font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:1.55;font-weight:400;color:#71717A;">
<p class="muted" style="margin:0 0 6px 0;font-size:13px;line-height:1.55;color:#52525B;">{{org}}</p>
<p class="muted" style="margin:0;font-size:13px;line-height:1.55;color:#71717A;">{{footer}}</p>
<!--bu-footer-extra-->
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
