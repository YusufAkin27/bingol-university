# Uretim profili (SPRING_PROFILES_ACTIVE=prod). Varsayilan SIR YOKTUR: eksik zorunlu ayar
# config.ProdSettingsValidator ile acilista anlasilir bir hatayla uygulamayi durdurur.

# --- Zorunlu sirlar: gelistirme varsayilanlari ezilir (bos kalirsa dogrulayici reddeder) ---
spring.datasource.password=${DB_PASSWORD:}
jwt.secret=${JWT_SECRET:}
spring.security.user.password=${ADMIN_PASSWORD:}
app.cors.allowed-origins=${CORS_ORIGINS:}
app.crypto.require-keys=true

# --- Sema yalnizca Flyway; Hibernate dogrular, SQL basilmaz ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# --- Hata ayrintisi kapali (yigin izi / mesaj yok) ---
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.whitelabel.enabled=false

# --- Proxy arkasi: gercek istemci IP'si ve semasi (X-Forwarded-*); yalnizca guvenilir proxy onunde calistirin ---
server.forward-headers-strategy=framework

# --- Tomcat sinirlari ---
server.tomcat.max-http-form-post-size=64KB
server.tomcat.max-swallow-size=2MB
server.tomcat.threads.max=200
server.tomcat.accept-count=100
server.tomcat.connection-timeout=20s
server.max-http-request-header-size=16KB
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE:5MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST:6MB}

# --- Kapanis ---
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# --- HikariCP ---
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.leak-detection-threshold=60000

# --- Redis ---
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

# --- Actuator: yalnizca health (+info); ayrinti yok. /actuator/** health disinda ADMIN ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=false

# --- OpenAPI/Swagger uretimde kapali ---
springdoc.api-docs.enabled=${OPENAPI_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=false

# --- Log: kisa duzen (zaman damgasi + seviye + logger + mesaj); ayrinti sizdirmayan seviyeler ---
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} : %msg%n
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN
