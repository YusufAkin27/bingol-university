spring.application.name=bingol-backend
server.port=8080
server.compression.enabled=true
server.compression.mime-types=application/json
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
# Hata cevaplarinda ic ayrinti (stack trace, mesaj) sizdirma
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
# Profil: SPRING_PROFILES_ACTIVE=prod (application-prod.properties) veya dev (application-dev.properties)

# --- Veritabani: PostgreSQL (docker compose ile gelir) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bingol}
spring.datasource.username=${DB_USER:bingol}
spring.datasource.password=${DB_PASSWORD:bingol}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=20

# --- Redis (dogrulama kodlari, refresh token, rate limit) ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# --- JWT: uretimde JWT_SECRET ile en az 32 karakterlik gizli anahtar verin ---
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
jwt.access-ttl-minutes=15
jwt.refresh-ttl-days=30

# --- E-posta: enabled=false iken kod e-posta yerine log'a yazilir (yalnizca gelistirme) ---
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@bingol.edu.tr}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
management.health.mail.enabled=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- Gozlemlenebilirlik: Sentry (SENTRY_DSN bos = kapali, PII gonderilmez) ve Prometheus (prod'da ayri yonetim portu, bkz. application-prod) ---
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENVIRONMENT:}
sentry.release=${SENTRY_RELEASE:}
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:0.0}
management.metrics.tags.application=bu-backend
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# --- Zamanlayicilar (Europe/Istanbul) ---
# Haber/duyuru/etkinlik: her gece 00:00. Yemek listesi: ayin son gunu 23:30.
news.sync.cron=0 0 0 * * *
menu.sync.cron=0 30 23 L * *
# Veritabani bossa ilk acilista bir kez doldur
app.sync.initial-fill=${INITIAL_FILL:true}

# --- Yonetim (Basic auth, /api/admin/**); sifre ADMIN_PASSWORD ile verilmezse her acilista log'a yazilir ---
spring.security.user.name=admin
spring.security.user.roles=ADMIN

# --- Flyway / dosya yukleme / roller / FCM ---
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
# Birlesme: main kolundan gelen V96-V99, mobil kolunun V260 ile islenmis veritabaninda sirasiz uygulanabilsin
spring.flyway.out-of-order=true
# Video mesaj (40 MB) + poster icin ust sinir; diger yuklemeler kendi tur sinirlarini ayrica uygular
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE:45MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST:50MB}
app.storage.dir=${STORAGE_DIR:./data/uploads}
app.admin.emails=${ADMIN_EMAILS:}
app.fcm.credentials-file=${FCM_CREDENTIALS_FILE:}

# --- CORS (yonetim paneli): virgullu koken listesi; yalnizca /api/** ve /files/** ---
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# --- Cok dillilik (tr varsayilan, en, ar) ---
spring.messages.basename=i18n/messages,i18n/auth,i18n/mail,i18n/push,i18n/event,i18n/community,i18n/messaging,i18n/profile,i18n/news,i18n/ops,i18n/post,i18n/poll,i18n/academic
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# --- T1 medya hatti (app.media.*) ---
# Gorseller sunucunun YEREL diskinde (app.storage.dir; Docker'da volume) tutulur, yeniden kodlanip sikistirilir.
# max-upload-bytes: ham yukleme siniri (multipart limitleri en buyuk max-upload-bytes'tan kucuk OLMAMALI)
# max-dimension: uzun kenar px; max-stored-bytes: sikistirma SONRASI ust sinir (asilirsa kalite dusurulur,
# gerekirse kucultulur, yine sigmazsa 422 IMAGE_TOO_COMPLEX); jpeg-quality: baslangic kalitesi (1-100)
app.media.max-pixels=${MEDIA_MAX_PIXELS:25000000}
app.media.concurrency=${MEDIA_CONCURRENCY:4}
app.media.thumb-dimension=${MEDIA_THUMB_DIMENSION:320}
app.media.avatar.max-upload-bytes=${MEDIA_AVATAR_MAX_UPLOAD_BYTES:2097152}
app.media.avatar.max-dimension=${MEDIA_AVATAR_MAX_DIMENSION:512}
app.media.avatar.max-stored-bytes=${MEDIA_AVATAR_MAX_STORED_BYTES:153600}
app.media.avatar.jpeg-quality=${MEDIA_AVATAR_JPEG_QUALITY:85}
app.media.cover.max-upload-bytes=${MEDIA_COVER_MAX_UPLOAD_BYTES:3145728}
app.media.cover.max-dimension=${MEDIA_COVER_MAX_DIMENSION:1600}
app.media.cover.max-stored-bytes=${MEDIA_COVER_MAX_STORED_BYTES:409600}
app.media.cover.jpeg-quality=${MEDIA_COVER_JPEG_QUALITY:85}
app.media.post.max-upload-bytes=${MEDIA_POST_MAX_UPLOAD_BYTES:3145728}
app.media.post.max-dimension=${MEDIA_POST_MAX_DIMENSION:1600}
app.media.post.max-stored-bytes=${MEDIA_POST_MAX_STORED_BYTES:409600}
app.media.post.jpeg-quality=${MEDIA_POST_JPEG_QUALITY:85}
app.media.chat.max-upload-bytes=${MEDIA_CHAT_MAX_UPLOAD_BYTES:5242880}
app.media.chat.max-dimension=${MEDIA_CHAT_MAX_DIMENSION:1600}
app.media.chat.max-stored-bytes=${MEDIA_CHAT_MAX_STORED_BYTES:512000}
app.media.chat.jpeg-quality=${MEDIA_CHAT_JPEG_QUALITY:85}
# --- T16: bildirim saklama (okunmus X gun, okunmamis Y gun sonra silinir; gece 03:30) ---
app.notification.retention-days=${NOTIFICATION_RETENTION_DAYS:90}
app.notification.unread-retention-days=${NOTIFICATION_UNREAD_RETENTION_DAYS:365}
# --- T7: OpenAPI (springdoc). /v3/api-docs yalnizca ADMIN; Swagger arayuzu varsayilan KAPALI (dev profili veya SWAGGER_UI_ENABLED=true) ---
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:false}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
springdoc.api-docs.enabled=${OPENAPI_DOCS_ENABLED:true}
springdoc.default-produces-media-type=application/json

# --- T21: mesaj sifreleme (AES-256-GCM, sunucu tarafi saklama; uctan uca DEGIL) ---
# Ana anahtarlar: "id:base64(32 bayt)" listesi; bos + prod = acilmaz, bos + gelistirme = uyarili gelistirme anahtari
app.crypto.master-keys=${CRYPTO_MASTER_KEYS:}
app.crypto.master-keys-file=${CRYPTO_MASTER_KEYS_FILE:}
app.crypto.active-key-id=${CRYPTO_ACTIVE_KEY_ID:}
app.crypto.require-keys=${CRYPTO_REQUIRE_KEYS:false}
app.crypto.admin-decrypt-enabled=${CRYPTO_ADMIN_DECRYPT_ENABLED:true}
app.crypto.dek-cache-ttl-seconds=300
app.crypto.admin-decrypt-per-hour=30
app.crypto.admin-decrypt-max-messages=200

# --- T15: kulup/etkinlik sohbet odalari ---
app.chat.room-max-members=${CHAT_ROOM_MAX_MEMBERS:500}
app.chat.room-purge-ms=${CHAT_ROOM_PURGE_MS:300000}
# --- T21 Asama 2: mesaj gecisi ve push onizleme ---
app.crypto.migrate-messages=${CRYPTO_MIGRATE_MESSAGES:true}
app.crypto.null-plaintext-after-encrypt=${CRYPTO_NULL_PLAINTEXT:true}
# true ise push govdesine mesaj onizlemesi gider (uygulama ici bildirim tablosuna ASLA yazilmaz)
app.push.message-preview=${PUSH_MESSAGE_PREVIEW:false}

# --- T8 sohbet gorselleri (app.chat.media.*; sinirlar app.media.chat.* ile ayarlanir) ---
app.chat.media.uploads-per-minute=${CHAT_MEDIA_PER_MINUTE:20}
app.chat.media.uploads-per-day=${CHAT_MEDIA_PER_DAY:200}
# Mesaj basina ek (foto/video karisik) ust siniri; video bayt toplami ayri sinirlidir
app.chat.media.max-attachments-per-message=${CHAT_MEDIA_MAX_PER_MESSAGE:10}
app.chat.media.video-max-total-bytes-per-message=${CHAT_VIDEO_MAX_TOTAL_BYTES:125829120}
app.chat.media.pending-max=${CHAT_MEDIA_PENDING_MAX:30}
app.chat.media.unclaimed-hours=${CHAT_MEDIA_UNCLAIMED_HOURS:24}
app.chat.media.link-ttl-seconds=${CHAT_MEDIA_LINK_TTL:300}
app.chat.media.cleanup-cron=${CHAT_MEDIA_CLEANUP_CRON:0 15 * * * *}
# Video mesaj: sunucu yeniden kodlamaz (istemci sikistirir); boyut/sure asilirsa VIDEO_TOO_LARGE (413) / VIDEO_TOO_LONG (400)
app.chat.media.video-max-bytes=${CHAT_VIDEO_MAX_BYTES:41943040}
app.chat.media.video-max-seconds=${CHAT_VIDEO_MAX_SECONDS:60}
app.chat.media.video-daily-limit=${CHAT_VIDEO_DAILY_LIMIT:30}

# --- Gonderi medyasi (Kesfet): ozel depo `_private/post`; video mp4 <=60 sn <=40 MB; saatte 30 yukleme ---
app.post.media.video-max-bytes=${POST_VIDEO_MAX_BYTES:41943040}
app.post.media.video-max-seconds=${POST_VIDEO_MAX_SECONDS:60}
app.post.media.uploads-per-hour=${POST_MEDIA_UPLOADS_PER_HOUR:30}
app.post.media.pending-max=${POST_MEDIA_PENDING_MAX:30}
app.post.media.max-per-post=10
app.post.media.max-videos-per-post=10
app.post.media.unattached-hours=${POST_MEDIA_UNATTACHED_HOURS:24}
app.post.media.deleted-retention-days=${POST_MEDIA_DELETED_RETENTION_DAYS:30}

# --- T13: sohbet ozellikleri ---
# Mesaj duzenleme suresi (dakika); gecince 403 MESSAGE_EDIT_EXPIRED
app.chat.edit-window-minutes=${CHAT_EDIT_WINDOW_MINUTES:0}
# Gonderenin herkes icin silme suresi (dakika); 0 = sinirsiz. Grup yoneticisi her zaman suresiz silebilir
app.chat.delete-window-minutes=${CHAT_DELETE_WINDOW_MINUTES:0}
# Izinli tepki emojileri (virgullu); bos = varsayilan 6 emoji (kod icinde)
app.chat.reactions=${CHAT_REACTIONS:}
# T24: herkes icin silinen mesajlarin (sifreli) saklama suresi, gun; 0 = suresiz (temizleme isi kapali)
app.chat.deleted-retention-days=${CHAT_DELETED_RETENTION_DAYS:0}

# --- T25: etkinlik sohbet odasi ---
# true ise etkinlik ilk GOING katilimciyi alinca oda otomatik kurulur; false: organizator acar
app.chat.event-room-auto=${CHAT_EVENT_ROOM_AUTO:false}
# Etkinlik bittikten kac gun sonra oda otomatik kapanir
app.chat.event-room-close-days=${CHAT_EVENT_ROOM_CLOSE_DAYS:7}

# T27: herkese acik destek talebi
app.support.public-ticket-retention-days=${PUBLIC_TICKET_RETENTION_DAYS:365}
app.support.track-base-url=${PUBLIC_WEB_URL:http://localhost:8090}
app.support.min-fill-seconds=3

# Sohbet ek saklama (V270): tek gosterimlik gorsel baytlari alici actiktan sonra yonetici onizlemesi icin bu kadar gun tutulur (0 = eski davranis)
app.chat.media.view-once-retention-days=${CHAT_VIEW_ONCE_RETENTION_DAYS:365}

# --- Erisim engelleri (IP/CIDR/cihaz/kullanici): bkz. docs/ADMIN_API.md, docs/DEPLOY.md ---
# Cihaz kimligi (X-Device-Id) HMAC-SHA256 anahtari; bos ise JWT sirrindan turetilir. Uretimde ayri ve kalici verin (>=32 kr).
app.security.device-hmac-key=${DEVICE_HMAC_KEY:}
# Asla IP ile engellenmeyecek ek aglar (virgullu IP/CIDR; yonetici ofis cikis adresleri). Loopback ve ozel aglar zaten muaftir.
app.security.ban-allowlist=${BAN_ALLOWLIST:}
# true ise yoneticinin yukledigi anonimlestirici (Tor/VPN/veri merkezi) araliklarindan gelen istekler engellenir
app.security.block-anonymizers=${BLOCK_ANONYMIZERS:false}
app.security.ban-cache-ttl-seconds=${BAN_CACHE_TTL_SECONDS:20}
app.security.ban-log-retention-days=${BAN_LOG_RETENTION_DAYS:90}

# Uygunsuz ifade filtresi (herkese acik metinler; sohbet muaf)
app.moderation.profanity.enabled=${PROFANITY_ENABLED:true}
app.moderation.profanity.mode=${PROFANITY_MODE:BLOCK}
app.moderation.profanity.cache-ttl-seconds=${PROFANITY_CACHE_TTL_SECONDS:30}

# --- Kalici push kuyrugu (outbox) ---
app.push.outbox.enabled=${PUSH_OUTBOX_ENABLED:true}
app.push.outbox.poll-ms=${PUSH_OUTBOX_POLL_MS:5000}
app.push.outbox.batch-size=${PUSH_OUTBOX_BATCH:500}
app.push.outbox.max-attempts=${PUSH_OUTBOX_MAX_ATTEMPTS:6}
app.push.outbox.max-age-hours=${PUSH_OUTBOX_MAX_AGE_HOURS:24}
# false: FCM kimligi yokken push kuyruga yazilmaz (birikmez); true: PENDING'de bekler, kimlik gelince gider
app.push.outbox.hold-when-disabled=${PUSH_OUTBOX_HOLD_WHEN_DISABLED:false}

# --- Anket ve oylama ---
app.poll.close-cron=${POLL_CLOSE_CRON:0 */10 * * * *}

# --- Hikayeler (24 saat): video <=30 sn; sure dolunca 24 saat sonra kalici silinir ---
app.story.video-max-seconds=${STORY_VIDEO_MAX_SECONDS:30}
app.story.ttl-hours=${STORY_TTL_HOURS:24}
app.story.retention-hours=${STORY_RETENTION_HOURS:24}
app.story.cleanup-cron=${STORY_CLEANUP_CRON:0 35 * * * *}

# --- V2 medya donusturme (ffmpeg), gonderi videosu sifreleme gocu ve CDN (docs/MEDIA_PIPELINE.md, docs/DEPLOY.md bolum 10) ---
app.media.transcode.enabled=${MEDIA_TRANSCODE_ENABLED:true}
app.media.transcode.workers=${MEDIA_TRANSCODE_WORKERS:2}
app.media.transcode.threads-per-job=${MEDIA_TRANSCODE_THREADS:1}
app.media.transcode.timeout-seconds=${MEDIA_TRANSCODE_TIMEOUT:300}
app.media.transcode.temp-dir=${MEDIA_TRANSCODE_TEMP_DIR:}
app.media.transcode.encrypt-existing=${MEDIA_ENCRYPT_EXISTING:false}
app.media.transcode.reseal-key-id=${MEDIA_RESEAL_KEY_ID:}
app.media.cdn.base-url=${MEDIA_CDN_BASE_URL:}
app.media.cdn.redirect=${MEDIA_CDN_REDIRECT:false}
app.media.cdn.ttl-seconds=${MEDIA_CDN_TTL:300}
