spring.application.name=bingol-backend
server.port=8080

# Gelistirme: dosya tabanli H2 (./data). Uretimde PostgreSQL'e gecin.
spring.datasource.url=jdbc:h2:file:./data/bingol
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Redis (dogrulama kodlari, refresh token, rate limit)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# JWT: uretimde JWT_SECRET ortam degiskeni ile en az 32 karakterlik gizli anahtar verin
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
jwt.access-ttl-minutes=15
jwt.refresh-ttl-days=30

# E-posta: app.mail.enabled=false iken kod e-posta yerine log'a yazilir (yalnizca gelistirme)
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@bingol.edu.tr}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
management.health.mail.enabled=false

# Yonetim (Basic auth) kullanicisi; sifre ADMIN_PASSWORD ile verilmezse her acilista log'a rastgele yazilir
spring.security.user.name=admin
spring.security.user.roles=ADMIN
