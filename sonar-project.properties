sonar.projectKey=bu-kampus
sonar.projectName=BU Kampus
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# Backend (Java) + Web (TypeScript) tek projede
sonar.sources=backend/src/main/java,web/src
sonar.tests=backend/src/test/java,web/src
sonar.test.inclusions=backend/src/test/java/**,web/src/**/*.test.ts,web/src/**/*.test.tsx,web/src/test/**
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,web/src/**/*.test.ts,web/src/**/*.test.tsx,web/src/test/**,backend/src/main/resources/db/migration/**

sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.java.source=17
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info

# Kapsam disi: yalniz uretilmis/ayar sinifi degil; sadece test yardimcilari
sonar.coverage.exclusions=web/src/main.tsx,web/src/test/**
