# --- URL hijyeni (teknik SEO; ayrıntı ve gerekçe: docs/SEO_TECHNICAL.md) ---
# Bu dosya conf.d altından http{} bağlamına dahil edilir; bu yüzden map burada yazılabilir.
#
# Tek kanonik biçim: dil öneki küçük harf, sonda eğik çizgi YOK, "/index.html" YOK, art arda eğik çizgi YOK.
# Eşleşen ilk kural kazanır: önce çift eğik çizgi, sonra /index.html, sonra sondaki eğik çizgi. Karşılığı boşsa yönlendirme yok.
map $request_uri $site_canon {
    default "";
    "~^(?<dsl_a>[^?]*?)//+(?<dsl_b>.*)$"                                "$dsl_a/$dsl_b";
    "~^(?<ixp>/(?:tr|en|ar)(?:/[^?]*?)?)/index\.html(?<ixq>\?.*)?$"    "$ixp$ixq";
    "~^(?<tsp>/(?:tr|en|ar)(?:/[^?]*[^/?])?)/(?<tsq>\?.*)?$"           "$tsp$tsq";
}

# /TR/privacy, /En/faq gibi büyük harfli dil öneki -> küçük harf (kalıcı)
map $request_uri $lang_case_fix {
    default "";
    "~^/(?:TR|Tr|tR)(?<lcr_tr>(?:[/?].*)?)$"    "/tr$lcr_tr";
    "~^/(?:EN|En|eN)(?<lcr_en>(?:[/?].*)?)$"    "/en$lcr_en";
    "~^/(?:AR|Ar|aR)(?<lcr_ar>(?:[/?].*)?)$"    "/ar$lcr_ar";
}

# Eski (dil öneksiz) adres -> /tr + aynı yol; sondaki eğik çizgi ATILIR (tek atlamada kanonik adres), sorgu dizisi korunur
# (ör. /support/track?token=...). Ham $request_uri kullanılır: çözülmüş $uri satır sonu enjeksiyonuna açık olurdu.
map $request_uri $legacy_target {
    "~^(?<lg_p>[^?]*?)/+(?<lg_q>\?.*)?$"    "/tr$lg_p$lg_q";
    default                                   "/tr$request_uri";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS: backend henüz ayağa kalkmamışken nginx'in açılışta çökmemesi için değişkenle çözülür
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    # Port eslemesi/ters vekil arkasinda dizin yonlendirmeleri portu dusurmesin
    absolute_redirect off;

    # Arapça/Türkçe metinler her yanıtta açıkça UTF-8 olarak etiketlenir (sitemap.xml ve robots.txt dahil)
    charset utf-8;
    charset_types text/xml text/plain text/vnd.wap.wml application/javascript application/xml application/json application/manifest+json;

    client_max_body_size 12m;

    # Sıkıştırma: nginx imajında brotli modülü yok; gzip burada, ön tarafta Caddy (deploy/Caddyfile: encode zstd gzip) zaten
    # sıkıştırılmış yanıtı olduğu gibi geçirir. gzip_proxied any: ters vekil (Via/X-Forwarded-*) arkasında da sıkıştır.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/manifest+json application/xml image/svg+xml;

    include /etc/nginx/snippets/security.conf;

    # API, dosyalar ve WebSocket aynı kökenden backend'e yönlenir (üretimde Caddy bunları doğrudan backend'e verir;
    # buradaki başlıklar web konteynerine doğrudan erişilen kurulumlar içindir). Hiçbiri arama dizinine girmemeli.
    location ^~ /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        add_header X-Robots-Tag "noindex, nofollow" always;
        include /etc/nginx/snippets/security.conf;
    }

    location ^~ /files/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        add_header X-Robots-Tag "noindex, nofollow" always;
        include /etc/nginx/snippets/security.conf;
    }

    location ^~ /ws {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        add_header X-Robots-Tag "noindex, nofollow" always;
        include /etc/nginx/snippets/security.conf;
    }

    # Paylaşım sayfası ve OpenGraph görseli (/s/{p|r|n|e}/{id}[/img]): backend HTML üretir (docs/SHARING.md). Üretimde Caddy bunu
    # doğrudan backend'e verir; burası web konteynerine doğrudan erişilen kurulumlar içindir. Backend kendi CSP / X-Robots-Tag /
    # Cache-Control başlıklarını yazar: security.conf BİLEREK dahil edilmez (ikinci bir CSP, satır içi betiği engellerdi).
    location ^~ /s/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Language $http_accept_language;
        proxy_read_timeout 30s;
    }

    # Hash'li statik dosyalar (Vite içerik özetini dosya adına koyar): bir yıl, değişmez.
    # expires KULLANILMAZ: add_header ile birlikte çift Cache-Control üretirdi.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security.conf;
        try_files $uri =404;
    }

    # Yazı tipleri (Inter değişken woff2, adı sabit ama içerik değişmez; değişirse dosya adı sürümlenir): bir yıl, değişmez
    location ^~ /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security.conf;
        try_files $uri =404;
    }

    # Marka dosyaları: favicon bir hafta, manifest bir gün (ad/simge değişince çabuk yayılsın)
    location = /favicon.ico {
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/snippets/security.conf;
        try_files $uri =404;
    }

    location = /site.webmanifest {
        add_header Cache-Control "public, max-age=86400";
        default_type application/manifest+json;
        include /etc/nginx/snippets/security.conf;
        try_files $uri =404;
    }

    # robots.txt ve sitemap.xml: bir saat (gece yeniden üretimi hızlı yayılsın); sitemap application/xml
    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/snippets/security.conf;
        try_files $uri =404;
    }

    # $dyn_root: gece yenileme katmanı (scripts/refresh-prerender.mjs; derlemeye özel kimlikli dizin, web/scripts/prerender.mjs
    # üretir). Katman yoksa (volume bağlı değil / henüz çalışmadı) derleme çıktısı sunulur.
    location = /sitemap.xml {
        types { }
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/snippets/security.conf;
        root $dyn_root;
        try_files /sitemap.xml @static_sitemap;
    }

    location @static_sitemap {
        types { }
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/snippets/security.conf;
        root /usr/share/nginx/html;
        try_files /sitemap.xml =404;
    }

    # Gerçek dosya yoksa yalın 404 (SPA HTML'i dönmesin: assetlinks.json / apple-app-site-association soft-404 vermesin)
    location @plain404 {
        default_type text/plain;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security.conf;
        return 404 "Not Found\n";
    }

    # Uygulama bağlantısı doğrulama dosyaları (App Links / Universal Links). Dosyalar web/public/.well-known/ altına
    # konunca burada sunulur: JSON, yönlendirme YOK, apple-app-site-association uzantısız. Yoksa 404.
    # Ekleme adımları: docs/SEO_TECHNICAL.md bölüm 7.
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/snippets/security.conf;
        error_page 404 = @plain404;
        try_files $uri =404;
    }

    # Eski iOS (9.3.1 ve öncesi) kökten ister
    location = /apple-app-site-association {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/snippets/security.conf;
        error_page 404 = @plain404;
        try_files $uri =404;
    }

    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/snippets/security.conf;
        error_page 404 = @plain404;
        try_files $uri =404;
    }

    location ^~ /.well-known/ {
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/snippets/security.conf;
        error_page 404 = @plain404;
        try_files $uri =404;
    }

    # Gizli dosyalar (.env, .git, ...) ve derleme aracı dosyası hiçbir zaman sunulmaz
    location ~ /\.(?!well-known/) {
        return 404;
    }

    location = /_nginx-generated.conf {
        return 404;
    }

    # Yönetim arayüzü konumları (yol derlemede VITE_ADMIN_PATH'ten üretilir; hepsi noindex). Bkz. web/scripts/prerender.mjs
    include /etc/nginx/snippets/generated-locations.conf;

    # Eski (dil onekisiz) site adresleri -> /tr (kalici). Google Play'e verilmis /privacy, /delete-account vb. bozulmaz.
    # /brand/<dosya> statik varliktir: yalniz /brand ve /brand/ yonlenir. /sitemap.xml ve /robots.txt eslesmez.
    location ~ ^/(about|features|download|faq|contact|support/track|legal|data-request|privacy|terms|cookies|delete-account|accessibility|sitemap|security|community-guidelines|child-safety|help|news|menu|changelog)(/.*)?$ {
        return 301 $legacy_target;
    }

    location ~ ^/brand/?$ {
        return 301 /tr/brand;
    }

    # Büyük harfli dil öneki (/TR/privacy) -> küçük harf (kalıcı)
    location ~ ^/(?:TR|Tr|tR|EN|En|eN|AR|Ar|aR)(?:/|$) {
        return 301 $lang_case_fix;
    }

    # Hash'siz küçük dosyalar (og.png, brand/*, theme-init.js...): bir hafta
    location ~* \.(?:svg|ico|png|jpg|jpeg|webp|woff2?|js)$ {
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/snippets/security.conf;
        try_files $uri =404;
    }

    # 404 (T-158 / A3-12): bilinmeyen yol HTTP 404 doner (soft 404 degil). Govde, derleme zamaninda uretilen
    # 404.html (ayni SPA kabugu + noindex + h1); arama motorlari sayfayi dizine almaz.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
        include /etc/nginx/snippets/security.conf;
    }

    # Haber ayrintisi: sayisal kimlik (kimligin varligini istemci denetler; yoksa NotFoundPage noindex ile cizilir).
    # Haber ayrintisi sayfalari dizine ALINMAZ (kaynak icerik ozeti: kopya/ince icerik riski; liste sayfasi dizinde kalir).
    location ~ ^/(tr|en|ar)/news/[0-9]+/?$ {
        if ($site_canon) { return 301 $site_canon; }
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, follow" always;
        include /etc/nginx/snippets/security.conf;
        try_files /$1/index.html /index.html;
    }

    # Hukuki metin turu: paths.site.legal kucuk harf/tire uretir; parseLegalType buyuk-kucuk harf ve _ / - kabul eder
    location ~* ^/(tr|en|ar)/legal/(terms|privacy|kvkk|community[-_]rules|explicit[-_]consent|cookies|content[-_]removal|retention)/?$ {
        if ($site_canon) { return 301 $site_canon; }
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security.conf;
        try_files $uri/index.html /$1/index.html /index.html;
    }

    # Destek talebi izleme baglantisi (token sorgu dizesinde): her zaman kabuk; asla dizine girmesin
    location ~ ^/(tr|en|ar)/support/track/?$ {
        if ($site_canon) { return 301 $site_canon; }
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
        include /etc/nginx/snippets/security.conf;
        try_files /$1/index.html /index.html;
    }

    # Menü ve haber listesi: gece yenileme katmanı (güncel veriyle yeniden yazılmış HTML) varsa o, yoksa derleme çıktısı.
    # Katman derlemeye özeldir ($dyn_root): yeni dağıtımdan sonra eski katman kullanılmaz.
    location ~ ^/(tr|en|ar)/(menu|news)/?$ {
        if ($site_canon) { return 301 $site_canon; }
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "max-image-preview:large" always;
        include /etc/nginx/snippets/security.conf;
        root $dyn_root;
        try_files /$1/$2/index.html @static_html;
    }

    location @static_html {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "max-image-preview:large" always;
        include /etc/nginx/snippets/security.conf;
        root /usr/share/nginx/html;
        try_files $uri/index.html =404;
    }

    # Dil onekli site (/tr /en /ar): derleme zamaninda uretilmis sayfa HTML'i (/tr/privacy -> /tr/privacy/index.html,
    # yonlendirme olmadan). Dinamik ama GECERLI yollar (haber kimligi, hukuki metin turu, destek izleme) yukarida ayri
    # ayri kabuk (200) alir; digerleri 404. Siralama onemlidir: ozel kurallar bu genel kuraldan ONCE gelmelidir.
    # Kabuk her zaman ayni SPA'dir; kabuk asla onbellege alinmaz. Kanonik olmayan biçimler (sonda /, /index.html, //) 301 alır.
    location ~ ^/(tr|en|ar)(/|$) {
        if ($site_canon) { return 301 $site_canon; }
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "max-image-preview:large" always;
        include /etc/nginx/snippets/security.conf;
        try_files $uri/index.html $uri =404;
    }

    # Kök: dil seçimi istemcide yapılır (kayıtlı dil / tarayıcı dili). Sunucu Accept-Language ile YÖNLENDİRMEZ:
    # botlar her zaman aynı içeriği (Türkçe ana sayfa üstverisi, canonical /tr) görür. /index.html aşağıda 301 ile köke döner.
    location = / {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "max-image-preview:large" always;
        include /etc/nginx/snippets/security.conf;
        try_files /index.html =404;
    }

    location = /index.html {
        return 301 /;
    }

    # Geri kalan her şey: gerçek bir dosya ya da 404. (Eskiden SPA düşüşü her bilinmeyen yola 200 + HTML dönüyordu =
    # soft 404; site rotalarının tümü /tr /en /ar önekli ya da yönetim yoludur, ikisi de yukarıda.)
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security.conf;
        try_files $uri =404;
    }
}
