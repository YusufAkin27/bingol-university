server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS: backend henüz ayağa kalkmamışken nginx'in açılışta çökmemesi için değişkenle çözülür
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    # Port eslemesi/ters vekil arkasinda dizin yonlendirmeleri portu dusurmesin
    absolute_redirect off;

    client_max_body_size 12m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    include /etc/nginx/snippets/security.conf;

    # API, dosyalar ve WebSocket aynı kökenden backend'e yönlenir
    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        include /etc/nginx/snippets/security.conf;
    }

    location /files/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        include /etc/nginx/snippets/security.conf;
    }

    location /ws {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        include /etc/nginx/snippets/security.conf;
    }

    # Hash'li statik dosyalar: bir yıl, değişmez
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security.conf;
        try_files $uri =404;
    }

    # Marka dosyaları: favicon bir hafta, manifest bir gün (ad/simge değişince çabuk yayılsın)
    location = /favicon.ico {
        expires 7d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security.conf;
        try_files $uri =404;
    }

    location = /site.webmanifest {
        expires 1d;
        add_header Cache-Control "public";
        default_type application/manifest+json;
        include /etc/nginx/snippets/security.conf;
        try_files $uri =404;
    }

    # Eski (dil onekisiz) site adresleri -> /tr (kalici). Google Play'e verilmis /privacy, /delete-account vb. bozulmaz.
    # /brand/<dosya> statik varliktir: yalniz /brand ve /brand/ yonlenir. /sitemap.xml ve /robots.txt eslesmez.
    location ~ ^/(about|features|download|faq|contact|support/track|legal|data-request|privacy|terms|cookies|delete-account|accessibility|sitemap|security|community-guidelines|help|news|menu|changelog)(/.*)?$ {
        return 301 /tr$request_uri;
    }

    location ~ ^/brand/?$ {
        return 301 /tr/brand;
    }

    # Hash'siz küçük dosyalar
    location ~* \.(?:svg|ico|png|jpg|jpeg|webp|woff2?|js)$ {
        expires 7d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security.conf;
        try_files $uri =404;
    }

    # Dil onekli site (/tr /en /ar): derleme zamaninda uretilmis sayfa HTML'i once denenir
    # (/tr/privacy -> /tr/privacy/index.html, yonlendirme olmadan); bilinmeyen derin baglanti o dilin ana sayfa kabugunu alir.
    # Kabuk her zaman ayni SPA'dir; kabuk asla onbellege alinmaz.
    location ~ ^/(tr|en|ar)(/|$) {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security.conf;
        try_files $uri/index.html $uri /$1/index.html /index.html;
    }

    # SPA: bilinmeyen yollar index.html'e düşer; kabuk asla önbelleğe alınmaz
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security.conf;
        try_files $uri $uri/ /index.html;
    }
}
