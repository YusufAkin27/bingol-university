<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Profili Düzenle Koyu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
.s{position:relative;width:390px;height:844px;box-sizing:border-box;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;overflow:hidden}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.hd{padding:60px 20px 0;display:flex;align-items:center;gap:12px}
.hd h1{margin:0;flex-grow:1;font-size:28px;font-weight:800;letter-spacing:-.4px}
.ib{width:44px;height:44px;border-radius:50%;background:var(--sf);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center}
.fl{margin:0 20px;display:flex;flex-direction:column;gap:5px}
.fl label{font-size:12px;font-weight:800;color:var(--mut);letter-spacing:.3px}
.in{height:48px;box-sizing:border-box;padding:0 16px;border-radius:14px;background:var(--sf);border:1px solid var(--bd);display:flex;align-items:center;font-size:15px;font-weight:600}
.in .i{margin-left:auto;color:var(--mut);width:18px;height:18px}
.tg{margin-left:auto;width:46px;height:28px;border-radius:14px;background:var(--sf2);position:relative;flex-shrink:0}
.tg::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.tg.on{background:var(--pr)}
.tg.on::after{left:21px;background:#1A0907}
</style>
</helmet>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.5"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
</svg>
<div class="s" style="--bg:#14161F;--sf:#1D2030;--sf2:#2C3045;--ink:#F4EFEB;--mut:#A5A9BA;--bd:#2E3247;--pr:#FF6A5F;--onpr:#1A0907;--soft:#3A1F22;--onsoft:#FFB4AC;--h1:#C62A20;--h2:#9E1F17">
  <div class="hd"><div class="ib"><svg class="i"><use href="#i-back"/></svg></div><h1>Profili düzenle</h1></div>

  <div style="margin:18px 0 0;display:flex;flex-direction:column;align-items:center;gap:10px">
    <div style="position:relative;width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800">AY
      <div style="position:absolute;right:-2px;bottom:-2px;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--bg);border:3px solid var(--bg);display:flex;align-items:center;justify-content:center"><svg class="i" style="width:16px;height:16px"><use href="#i-camera"/></svg></div>
    </div>
    <div style="font-size:14px;font-weight:800;color:var(--pr)">Fotoğrafı değiştir</div>
  </div>

  <div style="margin-top:18px;display:flex;flex-direction:column;gap:12px">
    <div class="fl"><label>AD SOYAD</label><div class="in">Ayşe Yılmaz</div></div>
    <div class="fl"><label>FAKÜLTE</label><div class="in">Mühendislik Fakültesi<svg class="i"><use href="#i-down"/></svg></div></div>
    <div style="margin:0 20px;display:flex;gap:10px">
      <div class="fl" style="margin:0;flex:1.6"><label>BÖLÜM</label><div class="in">Bilgisayar Müh.</div></div>
      <div class="fl" style="margin:0;flex:1"><label>SINIF</label><div class="in">3. sınıf<svg class="i"><use href="#i-down"/></svg></div></div>
    </div>
    <div class="fl"><label>HAKKIMDA</label><div class="in" style="height:84px;align-items:flex-start;padding-top:13px;font-weight:500;font-size:14px;line-height:1.4;color:var(--mut)">Mobil uygulama geliştirmeyi ve fotoğrafçılığı seviyorum.</div></div>
    <div class="in" style="margin:0 20px;height:52px">E-postamı diğer kullanıcılara göster<span class="tg"></span></div>
  </div>

  <div style="position:absolute;left:20px;right:20px;bottom:32px;height:54px;border-radius:14px;background:var(--pr);color:var(--onpr);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800">Kaydet</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
