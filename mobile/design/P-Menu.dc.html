<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Yemek</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
.s{position:relative;width:390px;height:844px;box-sizing:border-box;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;overflow:hidden}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.hd{padding:60px 20px 0;display:flex;align-items:center;gap:12px}
.hd h1{margin:0;flex-grow:1;font-size:28px;font-weight:800;letter-spacing:-.4px}
.ib{width:44px;height:44px;border-radius:50%;background:var(--sf);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center}
.day{flex:1;height:66px;border-radius:18px;background:var(--sf);border:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--mut)}
.day b{font-size:17px;color:var(--ink)}
.day.on{background:var(--pr);border-color:var(--pr);color:var(--onpr)}
.day.on b{color:var(--onpr)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:22px;padding:14px 16px}
.li{display:flex;gap:10px;align-items:flex-start;padding:3px 0;font-size:14px;line-height:1.4}
.li::before{content:"";flex-shrink:0;width:6px;height:6px;border-radius:50%;background:var(--pr);margin-top:7px}
.nav{position:absolute;left:20px;right:20px;bottom:22px;height:66px;box-sizing:border-box;padding:0 10px;border-radius:33px;background:var(--nav);color:var(--onnav);display:flex;align-items:center;justify-content:space-between;box-shadow:0 14px 30px rgba(23,30,51,.28)}
.ni{width:46px;height:46px;display:flex;align-items:center;justify-content:center;opacity:.75;border-radius:23px}
</style>
</helmet>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/></symbol>
  <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5Z"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.2A6.5 6.5 0 0 1 21.5 20"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="i-utensils" viewBox="0 0 24 24"><path d="M7 3v8a2 2 0 0 0 2 2v8M5 3v5M9 3v5M17 3c-2 2-3 5-3 8h3v10"/></symbol>
</svg>
<div class="s" style="--bg:#FAF6F3;--sf:#FFFFFF;--sf2:#F3ECE7;--ink:#171E33;--mut:#5F6577;--bd:#E8DFD8;--pr:#C62A20;--onpr:#FFFFFF;--soft:#FDE7E4;--onsoft:#8E1B13;--nav:#171E33;--onnav:#FFFFFF;--h1:#F73A2E;--h2:#C62A20">
  <div class="hd"><div class="ib"><svg class="i"><use href="#i-back"/></svg></div><h1>Yemek listesi</h1></div>

  <div style="margin:16px 20px 0;display:flex;align-items:center;gap:8px">
    <div class="ib" style="width:36px;height:36px"><svg class="i" style="width:18px;height:18px;transform:scaleX(-1)"><use href="#i-chev"/></svg></div>
    <div style="flex-grow:1;text-align:center;font-size:15px;font-weight:800">Ekim 2026</div>
    <div class="ib" style="width:36px;height:36px"><svg class="i" style="width:18px;height:18px"><use href="#i-chev"/></svg></div>
  </div>
  <div style="margin:12px 20px 0;display:flex;gap:8px">
    <div class="day">Cmt<b>24</b></div><div class="day">Paz<b>25</b></div><div class="day on">Pzt<b>26</b></div><div class="day">Sal<b>27</b></div><div class="day">Çar<b>28</b></div>
  </div>

  <div style="margin:16px 20px 0;position:relative;overflow:hidden;border-radius:26px;padding:18px;background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff">
    <div style="position:absolute;right:-30px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.15)"></div>
    <div style="position:relative;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.4px"><svg class="i" style="width:18px;height:18px"><use href="#i-utensils"/></svg>BUGÜN · 26 EKİM</div>
    <div style="position:relative;margin-top:12px;font-size:19px;font-weight:800;line-height:1.5">Mercimek çorbası<br>Tavuk sote<br>Pirinç pilavı<br>Cacık</div>
  </div>

  <div style="margin:12px 20px 0;display:flex;flex-direction:column;gap:10px">
    <div class="card">
      <div style="font-size:13px;font-weight:800;color:var(--mut);margin-bottom:6px">27 Ekim, Salı</div>
      <div class="li">Domates çorbası</div><div class="li">Kıymalı makarna</div><div class="li">Ayran</div>
    </div>
    <div class="card">
      <div style="font-size:13px;font-weight:800;color:var(--mut);margin-bottom:6px">28 Ekim, Çarşamba</div>
      <div class="li">Ezogelin çorbası</div><div class="li">Etli nohut</div><div class="li">Bulgur pilavı</div>
    </div>
  </div>

  <div class="nav">
    <div class="ni"><svg class="i"><use href="#i-home"/></svg></div>
    <div class="ni"><svg class="i"><use href="#i-compass"/></svg></div>
    <div class="ni"><svg class="i"><use href="#i-chat"/></svg></div>
    <div class="ni"><svg class="i"><use href="#i-users"/></svg></div>
    <div class="ni"><svg class="i"><use href="#i-user"/></svg></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
