<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Etkinlikler Koyu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
.s{position:relative;width:390px;height:844px;box-sizing:border-box;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;overflow:hidden}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.hd{padding:60px 20px 0;display:flex;align-items:center;gap:12px}
.hd h1{margin:0;flex-grow:1;font-size:28px;font-weight:800;letter-spacing:-.4px}
.ib{width:44px;height:44px;border-radius:50%;background:var(--sf);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center}
.day{flex:1;height:70px;border-radius:18px;background:var(--sf);border:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:700;color:var(--mut)}
.day b{font-size:18px;color:var(--ink)}
.day.on{background:var(--pr);border-color:var(--pr);color:var(--onpr)}
.day.on b{color:var(--onpr)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:22px;padding:14px;display:flex;gap:14px}
.dt{width:56px;height:64px;border-radius:16px;background:var(--soft);color:var(--onsoft);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;font-weight:800}
.dt b{font-size:22px;line-height:1}
.meta{margin-top:5px;font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.meta .i{width:14px;height:14px}
.btn{height:34px;padding:0 14px;border-radius:17px;background:var(--pr);color:var(--onpr);font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px}
.btn.o{background:transparent;border:1px solid var(--bd);color:var(--ink)}
.btn .i{width:14px;height:14px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--oksoft);color:var(--ok)}
.nav{position:absolute;left:20px;right:20px;bottom:22px;height:66px;box-sizing:border-box;padding:0 10px;border-radius:33px;background:var(--nav);color:var(--onnav);border:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;box-shadow:0 14px 30px rgba(0,0,0,.5)}
.ni{width:46px;height:46px;display:flex;align-items:center;justify-content:center;opacity:.75;border-radius:23px}
</style>
</helmet>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/></symbol>
  <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5Z"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.2A6.5 6.5 0 0 1 21.5 20"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-qr" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h3M20 17v4"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
</svg>
<div class="s" style="--bg:#14161F;--sf:#1D2030;--sf2:#24283A;--ink:#F4EFEB;--mut:#A5A9BA;--bd:#2E3247;--pr:#FF6A5F;--onpr:#1A0907;--soft:#3A1F22;--onsoft:#FFB4AC;--nav:#232738;--onnav:#F4EFEB;--ok:#5FD596;--oksoft:#11301F">
  <div class="hd"><div class="ib"><svg class="i"><use href="#i-back"/></svg></div><h1>Etkinlikler</h1><div class="ib" style="width:auto;padding:0 14px;border-radius:22px;font-size:13px;font-weight:800;gap:6px;display:flex"><svg class="i" style="width:16px;height:16px"><use href="#i-qr"/></svg>Yoklama</div></div>

  <div style="margin:18px 20px 0;font-size:14px;font-weight:800;color:var(--mut)">Ekim 2026</div>
  <div style="margin:10px 20px 0;display:flex;gap:8px">
    <div class="day">Pzt<b>26</b></div><div class="day">Sal<b>27</b></div><div class="day on">Çar<b>28</b></div><div class="day">Per<b>29</b></div><div class="day">Cum<b>30</b></div>
  </div>

  <div style="margin:18px 20px 0;display:flex;flex-direction:column;gap:12px">
    <div class="card">
      <div class="dt">EKİ<b>28</b></div>
      <div style="flex-grow:1;min-width:0">
        <div style="display:flex;gap:6px;align-items:center"><span class="tag"><svg class="i" style="width:12px;height:12px"><use href="#i-check"/></svg>Katılıyorsun</span></div>
        <div style="margin-top:6px;font-size:16px;font-weight:800">Kariyer Günleri</div>
        <div class="meta"><svg class="i"><use href="#i-clock"/></svg>14:00 – 17:00</div>
        <div class="meta"><svg class="i"><use href="#i-pin"/></svg>Konferans Salonu</div>
        <div style="margin-top:10px;display:flex;gap:8px;align-items:center"><div class="btn"><svg class="i"><use href="#i-qr"/></svg>Yoklama kodu</div><span style="font-size:12px;color:var(--mut)">86 katılıyor</span></div>
      </div>
    </div>
    <div class="card">
      <div class="dt">EKİ<b>28</b></div>
      <div style="flex-grow:1;min-width:0">
        <div style="font-size:16px;font-weight:800">Fotoğraf Yürüyüşü</div>
        <div style="font-size:12px;color:var(--mut);margin-top:3px">Fotoğraf Kulübü</div>
        <div class="meta"><svg class="i"><use href="#i-clock"/></svg>18:30</div>
        <div class="meta"><svg class="i"><use href="#i-pin"/></svg>Kampüs girişi</div>
        <div style="margin-top:10px;display:flex;gap:8px"><div class="btn">Katılıyorum</div><div class="btn o">İlgileniyorum</div></div>
      </div>
    </div>
    <div class="card">
      <div class="dt">EKİ<b>30</b></div>
      <div style="flex-grow:1;min-width:0">
        <div style="font-size:16px;font-weight:800">Satranç Turnuvası</div>
        <div class="meta"><svg class="i"><use href="#i-clock"/></svg>10:00</div>
        <div class="meta"><svg class="i"><use href="#i-pin"/></svg>Öğrenci Merkezi</div>
      </div>
    </div>
  </div>

  <div class="nav">
    <div class="ni"><svg class="i"><use href="#i-home"/></svg></div>
    <div class="ni"><svg class="i"><use href="#i-compass"/></svg></div>
    <div class="ni"><svg class="i"><use href="#i-chat"/></svg></div>
    <div class="ni"><svg class="i"><use href="#i-users"/></svg></div>
    <div class="ni"><svg class="i"><use href="#i-user"/></svg></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
