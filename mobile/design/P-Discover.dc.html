<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Keşfet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
.s{position:relative;width:390px;height:844px;box-sizing:border-box;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;overflow:hidden}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.hd{padding:60px 20px 0;display:flex;align-items:center;gap:12px}
.hd h1{margin:0;flex-grow:1;font-size:28px;font-weight:800;letter-spacing:-.4px}
.ib{width:44px;height:44px;border-radius:50%;background:var(--sf);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:20px}
.chip{height:36px;padding:0 16px;border-radius:18px;background:var(--sf);border:1px solid var(--bd);display:flex;align-items:center;font-size:13px;font-weight:700;color:var(--mut);white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--ink);color:var(--bg)}
.badge.red{background:var(--soft);color:var(--onsoft)}
.nav{position:absolute;left:20px;right:20px;bottom:22px;height:66px;box-sizing:border-box;padding:0 10px;border-radius:33px;background:var(--nav);color:var(--onnav);display:flex;align-items:center;justify-content:space-between;box-shadow:0 14px 30px rgba(23,30,51,.28)}
.ni{width:46px;height:46px;display:flex;align-items:center;justify-content:center;opacity:.75;border-radius:23px}
.ni.on{width:auto;padding:0 16px;gap:8px;background:var(--pr);color:var(--onpr);opacity:1;font-size:13px;font-weight:800}
</style>
</helmet>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/></symbol>
  <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5Z"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.2A6.5 6.5 0 0 1 21.5 20"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4Z"/></symbol>
</svg>
<div class="s" style="--bg:#FAF6F3;--sf:#FFFFFF;--sf2:#F3ECE7;--ink:#171E33;--mut:#5F6577;--bd:#E8DFD8;--pr:#C62A20;--onpr:#FFFFFF;--soft:#FDE7E4;--onsoft:#8E1B13;--nav:#171E33;--onnav:#FFFFFF;--h1:#F73A2E;--h2:#C62A20">
  <div class="hd"><h1>Keşfet</h1><div class="ib"><svg class="i"><use href="#i-search"/></svg></div></div>

  <div style="margin:16px 0 0 20px;display:flex;gap:8px;overflow:hidden">
    <div class="chip on">Haberler</div><div class="chip">Duyurular</div><div class="chip">Etkinlikler</div><div class="chip">Kaydedilenler</div>
  </div>

  <div class="card" style="margin:16px 20px 0;overflow:hidden">
    <div style="height:150px;background:linear-gradient(135deg,var(--h1),var(--h2));position:relative">
      <div style="position:absolute;right:-30px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.15)"></div>
      <span class="badge" style="position:absolute;left:14px;top:14px;background:#fff;color:#8E1B13">Haber</span>
    </div>
    <div style="padding:14px 16px 16px;display:flex;gap:12px;align-items:flex-start">
      <div style="flex-grow:1">
        <div style="font-size:17px;font-weight:800;line-height:1.3">Üniversitemiz yeni akademik yıla hazır</div>
        <div style="margin-top:6px;font-size:12px;color:var(--mut)">26 Ekim 2026</div>
      </div>
      <svg class="i" style="color:var(--mut)"><use href="#i-bookmark"/></svg>
    </div>
  </div>

  <div style="margin:14px 20px 0;display:flex;flex-direction:column;gap:10px">
    <div class="card" style="padding:12px;display:flex;gap:12px">
      <div style="width:76px;height:76px;border-radius:14px;background:var(--sf2);flex-shrink:0"></div>
      <div style="flex-grow:1;min-width:0">
        <span class="badge red">Duyuru</span>
        <div style="margin-top:6px;font-size:14px;font-weight:700;line-height:1.35">Güz dönemi ara sınav programı yayımlandı</div>
        <div style="margin-top:4px;font-size:12px;color:var(--mut)">25 Ekim 2026</div>
      </div>
      <svg class="i" style="color:var(--pr);fill:var(--pr)"><use href="#i-bookmark"/></svg>
    </div>
    <div class="card" style="padding:12px;display:flex;gap:12px">
      <div style="width:76px;height:76px;border-radius:14px;background:var(--sf2);flex-shrink:0"></div>
      <div style="flex-grow:1;min-width:0">
        <span class="badge">Haber</span>
        <div style="margin-top:6px;font-size:14px;font-weight:700;line-height:1.35">Kütüphane çalışma saatleri güncellendi</div>
        <div style="margin-top:4px;font-size:12px;color:var(--mut)">24 Ekim 2026</div>
      </div>
      <svg class="i" style="color:var(--mut)"><use href="#i-bookmark"/></svg>
    </div>
  </div>

  <div class="nav">
    <div class="ni"><svg class="i"><use href="#i-home"/></svg></div>
    <div class="ni on"><svg class="i"><use href="#i-compass"/></svg>Keşfet</div>
    <div class="ni"><svg class="i"><use href="#i-chat"/></svg></div>
    <div class="ni"><svg class="i"><use href="#i-users"/></svg></div>
    <div class="ni"><svg class="i"><use href="#i-user"/></svg></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() { return {}; }
}

</body>
</html>
