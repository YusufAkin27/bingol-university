<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Sohbet Detayı Koyu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
.s{position:relative;width:390px;height:844px;box-sizing:border-box;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;overflow:hidden;display:flex;flex-direction:column}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.top{padding:56px 16px 12px;display:flex;align-items:center;gap:12px;background:var(--sf);border-bottom:1px solid var(--bd);flex-shrink:0}
.ib{width:40px;height:40px;border-radius:50%;background:var(--sf2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.av{width:42px;height:42px;border-radius:50%;background:var(--soft);color:var(--onsoft);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
.msgs{flex-grow:1;padding:16px 16px 0;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.day{align-self:center;font-size:11px;font-weight:700;color:var(--mut);background:var(--sf2);padding:4px 12px;border-radius:999px;margin:4px 0}
.b{max-width:258px;padding:10px 14px;border-radius:20px;font-size:14px;line-height:1.4}
.b small{display:block;margin-top:4px;font-size:10px;opacity:.7;text-align:right}
.in{align-self:flex-start;background:var(--sf);border:1px solid var(--bd);border-bottom-left-radius:6px}
.out{align-self:flex-end;background:var(--pr);color:var(--onpr);border-bottom-right-radius:6px}
.rp{margin-bottom:6px;padding:6px 10px;border-radius:12px;background:rgba(255,255,255,.06);font-size:12px;line-height:1.35}
.out .rp{background:rgba(0,0,0,.14)}
.rp b{display:block;font-size:11px}
.bar{padding:10px 16px 30px;display:flex;align-items:center;gap:10px;background:var(--sf);border-top:1px solid var(--bd);flex-shrink:0}
.inp{flex-grow:1;height:46px;box-sizing:border-box;padding:0 18px;border-radius:23px;background:var(--sf2);display:flex;align-items:center;font-size:14px;color:var(--mut)}
.send{width:46px;height:46px;border-radius:50%;background:var(--pr);color:var(--onpr);display:flex;align-items:center;justify-content:center;flex-shrink:0}
</style>
</helmet>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4Z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
</svg>
<div class="s" style="--bg:#14161F;--sf:#1D2030;--sf2:#24283A;--ink:#F4EFEB;--mut:#A5A9BA;--bd:#2E3247;--pr:#FF6A5F;--onpr:#1A0907;--soft:#3A1F22;--onsoft:#FFB4AC">
  <div class="top">
    <div class="ib"><svg class="i"><use href="#i-back"/></svg></div>
    <div class="av">MK</div>
    <div style="flex-grow:1;min-width:0"><div style="font-size:16px;font-weight:800">Merve Kaya</div><div style="margin-top:2px;font-size:12px;color:#5FD596;font-weight:700">Çevrimiçi</div></div>
    <div class="ib"><svg class="i"><use href="#i-more"/></svg></div>
  </div>

  <div class="msgs">
    <div class="day">Bugün</div>
    <div class="b in">Selam! Yarınki sunum için notları aldın mı?<small>09:30</small></div>
    <div class="b out">Evet, akşam göndereceğim.<small>09:32</small></div>
    <div class="b in">Harika, yarın kütüphanede buluşalım mı?<small>09:41</small></div>
    <div class="b out"><div class="rp"><b>Merve Kaya</b>Harika, yarın kütüphanede buluşalım mı?</div>Olur, saat 10:00 uygun mu?<small>09:44 · okundu</small></div>
    <div class="b in">Tamam, görüşürüz!<small>09:45</small></div>
  </div>

  <div class="bar">
    <div class="ib" style="width:46px;height:46px"><svg class="i"><use href="#i-plus"/></svg></div>
    <div class="inp">Mesaj yaz</div>
    <div class="send"><svg class="i"><use href="#i-send"/></svg></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
