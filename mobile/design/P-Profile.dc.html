<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Profil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
.s{position:relative;width:390px;height:844px;box-sizing:border-box;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;overflow:hidden}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.hd{padding:60px 20px 0;display:flex;align-items:center;gap:12px}
.hd h1{margin:0;flex-grow:1;font-size:28px;font-weight:800;letter-spacing:-.4px}
.ib{width:44px;height:44px;border-radius:50%;background:var(--sf);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:22px}
.st{flex:1;padding:14px 0;text-align:center}
.st b{display:block;font-size:22px;font-weight:800}
.st span{font-size:12px;color:var(--mut)}
.grp{margin:12px 20px 0;overflow:hidden}
.mi{display:flex;align-items:center;gap:14px;padding:0 16px;height:54px;font-size:15px;font-weight:600;border-top:1px solid var(--bd)}
.mi:first-child{border-top:0}
.mi .i{width:22px;height:22px;color:var(--pr)}
.mi .ch{margin-left:auto;color:var(--mut);width:18px;height:18px}
.mi.dg,.mi.dg .i{color:#B3261E}
.nav{position:absolute;left:20px;right:20px;bottom:22px;height:66px;box-sizing:border-box;padding:0 10px;border-radius:33px;background:var(--nav);color:var(--onnav);display:flex;align-items:center;justify-content:space-between;box-shadow:0 14px 30px rgba(23,30,51,.28)}
.ni{width:46px;height:46px;display:flex;align-items:center;justify-content:center;opacity:.75;border-radius:23px}
.ni.on{width:auto;padding:0 16px;gap:8px;background:var(--pr);color:var(--onpr);opacity:1;font-size:13px;font-weight:800}
</style>
</helmet>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/></symbol>
  <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5Z"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.2A6.5 6.5 0 0 1 21.5 20"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16Z"/></symbol>
  <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4Z"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
</svg>
<div class="s" style="--bg:#FAF6F3;--sf:#FFFFFF;--sf2:#F3ECE7;--ink:#171E33;--mut:#5F6577;--bd:#E8DFD8;--pr:#C62A20;--onpr:#FFFFFF;--soft:#FDE7E4;--onsoft:#8E1B13;--nav:#171E33;--onnav:#FFFFFF;--h1:#F73A2E;--h2:#C62A20">
  <div class="hd"><h1>Profil</h1><div class="ib"><svg class="i"><use href="#i-gear"/></svg></div></div>

  <div class="card" style="margin:16px 20px 0;padding:18px;display:flex;align-items:center;gap:16px">
    <div style="width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800">AY</div>
    <div style="flex-grow:1;min-width:0">
      <div style="font-size:19px;font-weight:800">Ayşe Yılmaz</div>
      <div style="margin-top:2px;font-size:13px;color:var(--mut)">ayse.yilmaz@bingol.edu.tr</div>
      <div style="margin-top:8px;display:inline-block;font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--onsoft)">Mühendislik Fak. · Bilgisayar · 3. sınıf</div>
    </div>
  </div>

  <div class="card" style="margin:12px 20px 0;display:flex">
    <div class="st"><b>4</b><span>Kulüp</span></div>
    <div class="st" style="border-left:1px solid var(--bd);border-right:1px solid var(--bd)"><b>12</b><span>Etkinlik</span></div>
    <div class="st"><b>7</b><span>Kayıtlı haber</span></div>
  </div>

  <div class="card grp">
    <div class="mi"><svg class="i"><use href="#i-edit"/></svg>Profili düzenle<svg class="i ch"><use href="#i-chev"/></svg></div>
    <div class="mi"><svg class="i"><use href="#i-bookmark"/></svg>Kaydedilenler<svg class="i ch"><use href="#i-chev"/></svg></div>
    <div class="mi"><svg class="i"><use href="#i-cal"/></svg>Etkinliklerim<svg class="i ch"><use href="#i-chev"/></svg></div>
    <div class="mi"><svg class="i"><use href="#i-users"/></svg>Kulüplerim<svg class="i ch"><use href="#i-chev"/></svg></div>
  </div>
  <div class="card grp">
    <div class="mi"><svg class="i"><use href="#i-gear"/></svg>Ayarlar<svg class="i ch"><use href="#i-chev"/></svg></div>
    <div class="mi dg"><svg class="i"><use href="#i-logout"/></svg>Çıkış yap</div>
  </div>

  <div class="nav">
    <div class="ni"><svg class="i"><use href="#i-home"/></svg></div>
    <div class="ni"><svg class="i"><use href="#i-compass"/></svg></div>
    <div class="ni"><svg class="i"><use href="#i-chat"/></svg></div>
    <div class="ni"><svg class="i"><use href="#i-users"/></svg></div>
    <div class="ni on"><svg class="i"><use href="#i-user"/></svg>Profil</div>
  </div>
</div>
</x-dc>

  renderVals() { return {}; }
}
</script>
</body>
</html>
