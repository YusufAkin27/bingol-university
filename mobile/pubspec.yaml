name: bu_kampus
description: BÜ Kampüs - Bingöl Üniversitesi mobil uygulaması
publish_to: 'none'
version: 2.2.0+22003

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  http: ^1.2.0
  flutter_secure_storage: 11.2.0
  url_launcher: ^6.3.0
  lucide_icons_flutter: ^4.0.1
  image_picker: ^1.2.4
  mobile_scanner: ^7.4.2
  web_socket_channel: ^3.0.3
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  image: ^4.12.0
  http_parser: ^4.1.2
  gal: ^2.3.3
  video_player: ^2.14.1
  # Yalniz Android (iOS'ta CocoaPods gerekir, xcross desteklemez): packages/video_compress_android/README.md
  video_compress:
    path: packages/video_compress_android
  permission_handler: ^13.0.2
  flutter_contacts: ^2.6.0
  crypto: ^3.0.8
  path_provider: ^2.1.5
  photo_manager: ^3.9.0
  camera: ^0.12.0
  flutter_svg: ^2.3.0
  # Paylasim: sistem paylasim sayfasi (WhatsApp/Instagram...) icin share_plus (iOS UIActivityViewController, Android
  # ACTION_SEND; Flutter 3.38+/iOS 13+, SwiftPM destekli). Gelen paylasim baglantisini (https://bukampus.com.tr/s/{t}/{id},
  # bukampus://) yakalamak icin app_links (Android App Links + iOS Universal Links, UIScene destekli). Ikisi de
  # yayinci dogrulanmis, bakimda; baska eklentiyle ikamesi yok (url_launcher gelen baglanti dinlemez, paylasim sayfasi acmaz).
  share_plus: ^13.3.1
  app_links: ^7.2.2
  sign_in_with_apple: 8.2.0
  # Google ile giris. iOS SwiftPM cozumu: firebase_core/messaging 5.1/17.0 -> firebase-ios-sdk 13.1.1 (gtm-session-fetcher
  # 4.x-5.x, app-check 12.x ister). google_sign_in_ios 6.3.x GoogleSignIn-iOS 9.x ister (gtm-session-fetcher 3.x): CATISIR.
  # google_sign_in_ios >=6.4.0 GoogleSignIn-iOS "9.0.0"..<"11.0.0" kabul eder; SwiftPM 10.1.0'i secer
  # (gtm-session-fetcher 3.3-6.0, app-check 11-13: Firebase 13 ile uyumlu). Bu yuzden ALT SINIR ZORUNLU: dusurmeyin.
  google_sign_in: 7.2.0
  google_sign_in_ios: ^6.4.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  path_parsing: ^1.1.0

  video_player_platform_interface: any
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/logo_dark.png
    - assets/branding/logo_light.png
    - assets/branding/google_g.svg
    - assets/branding/default_avatar.png
    - assets/branding/default_group.png
    - assets/chat_wallpapers/
    - assets/licenses/hugeicons-MIT.txt

  # Tek yazi tipi: Inter (SIL OFL, assets/fonts/OFL.txt). Arapca icin sistem yedegi kullanilir.
  fonts:
    - family: BuIcons
      fonts:
        - asset: assets/fonts/BuIcons.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800

# Başlatıcı simgeleri: gerçek res/xcassets dosyaları `python -I -X utf8 mobile/tool/make_brand_assets.py` ile üretilir
# (kaynak brand/source/dark_logo.png + light_logo.png); flutter_launcher_icons yalnız yedek yoldur.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/icon_1024.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/branding/adaptive_foreground.png"
  adaptive_icon_monochrome: "assets/branding/adaptive_monochrome.png"
