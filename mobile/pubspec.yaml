name: bu_kampus
description: BÜ Kampüs - Bingöl Üniversitesi mobil uygulaması
publish_to: 'none'
version: 2.0.3+20003

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  http: ^1.2.0
  flutter_secure_storage: 11.2.0
  url_launcher: ^6.3.0
  lucide_icons_flutter: ^4.0.1
  image_picker: ^1.2.4
  mobile_scanner: ^7.4.2
  web_socket_channel: ^3.0.3
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  image: ^4.12.0
  http_parser: ^4.1.2
  gal: ^2.3.3
  video_player: ^2.14.1
  # Yalniz Android (iOS'ta CocoaPods gerekir, xcross desteklemez): packages/video_compress_android/README.md
  video_compress:
    path: packages/video_compress_android
  permission_handler: ^13.0.2
  flutter_contacts: ^2.6.0
  crypto: ^3.0.8
  path_provider: ^2.1.5
  photo_manager: ^3.9.0
  camera: ^0.12.0
  flutter_svg: ^2.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

  video_player_platform_interface: any
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/logo_horizontal.png
    - assets/branding/logo_horizontal_dark.png
    - assets/branding/logo.png
    - assets/branding/mark.png
    - assets/branding/mark.svg
    - assets/branding/mark_white.svg
    - assets/branding/mark_white.png
    - assets/branding/default_avatar.png
    - assets/branding/default_group.png
    - assets/chat_wallpapers/

  # Tek yazi tipi: Inter (SIL OFL, assets/fonts/OFL.txt). Arapca icin sistem yedegi kullanilir.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800

# Başlatıcı simgeleri: `dart run flutter_launcher_icons` (kaynaklar: node tool/make_icon_from_logo.js, kaynak assets/branding/logo.png)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/icon_1024.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#F73B2E"
  adaptive_icon_foreground: "assets/branding/adaptive_foreground.png"
  adaptive_icon_monochrome: "assets/branding/adaptive_monochrome.png"
