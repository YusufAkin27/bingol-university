name: bu_kampus
description: BÜ Kampüs - Bingöl Üniversitesi mobil uygulaması
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  flutter_secure_storage: 11.2.0
  url_launcher: ^6.3.0
  lucide_icons_flutter: ^4.0.1
  image_picker: ^1.2.4
  mobile_scanner: ^7.4.2
  web_socket_channel: ^3.0.3
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  image: ^4.12.0
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo_horizontal.png
    - assets/branding/logo_horizontal_dark.png
    - assets/branding/mark.png
    - assets/branding/mark_white.png

# Başlatıcı simgeleri: `dart run flutter_launcher_icons` (kaynaklar brand/build.js ile üretilir)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/icon_1024.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#F73A2E"
  adaptive_icon_foreground: "assets/branding/adaptive_foreground.png"
  adaptive_icon_monochrome: "assets/branding/adaptive_monochrome.png"
