# RL1 olcum yigini (YALNIZ test): docker compose -p rl1 -f scripts/perf/load/rl1/compose.yml up -d
# Gerekli ortam: JAR (backend.jar'in yolu, Windows'ta pwd -W bicimi), APP_PORT (varsayilan 18611). Bitince: down -v
# VPS'i taklit eden sinirlar: pg 2 GB/2 CPU (uretim ayarlari), uygulama 2 GB/2 CPU/-Xmx1g/Hikari 30.
name: rl1
services:
  postgres:
    image: postgres:16-alpine
    mem_limit: 2g
    cpus: 2
    shm_size: 256m
    environment:
      POSTGRES_DB: bingol
      POSTGRES_USER: bingol
      POSTGRES_PASSWORD: rl1pass-12345
    command: >
      postgres -c shared_buffers=512MB -c effective_cache_size=1280MB -c work_mem=8MB -c max_connections=100
      -c max_wal_size=2GB -c random_page_cost=1.1 -c log_lock_waits=on -c log_min_duration_statement=500
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bingol"]
      interval: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    mem_limit: 300m
    command: redis-server --maxmemory 200mb --maxmemory-policy volatile-lru --save ""
  app:
    image: eclipse-temurin:17-jre
    mem_limit: 2g
    cpus: 2
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-18611}:8080"
    volumes:
      - ${JAR}:/app/app.jar:ro
    environment:
      SPRING_PROFILES_ACTIVE: dev
      LOGGING_LEVEL_EDU_BINGOL: INFO
      DB_URL: jdbc:postgresql://postgres:5432/bingol
      DB_USER: bingol
      DB_PASSWORD: rl1pass-12345
      REDIS_HOST: redis
      JWT_SECRET: rl1-load-test-jwt-secret-0123456789abcdef
      ADMIN_PASSWORD: test-admin-sifre-12
      ADMIN_EMAILS: rl1.admin@bingol.edu.tr
      MAIL_ENABLED: "false"
      LEGAL_ENFORCE_REACCEPT: "false"
      INITIAL_FILL: "false"
      CRYPTO_MIGRATE_MESSAGES: "false"
      CRYPTO_MASTER_KEYS: "dev1:AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8="
      CRYPTO_ACTIVE_KEY_ID: dev1
      JAVA_TOOL_OPTIONS: -Xmx1g
      TZ: Europe/Istanbul
    command: ["java", "-jar", "/app/app.jar"]
