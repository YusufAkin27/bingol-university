# BÜ Kampüs - ÜRETİM yığını (tek sunucu). Kurulum: docs/DEPLOY.md, sırlar: docs/KEY_MANAGEMENT.md
#
#   cp .env.prod.example .env.prod        # veya: bash scripts/ops/gen-secrets.sh
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# UYARI: bu dosya TEK BASINA calisir. Kok docker-compose.yml ile (`-f docker-compose.yml -f docker-compose.prod.yml`)
# BIRLESTIRMEYIN: o dosya backend:8080 ve web:8090'i internete duz HTTP yayinlar. Birlestirilirse bile asagidaki
# `ports: !reset []` bu portlari sifirlar (Compose >= 2.24); disariya yalniz Caddy'nin 80/443 portu acik kalir.
# Izleme: `-f docker-compose.prod.yml -f monitoring/docker-compose.monitoring.yml` (docs/OBSERVABILITY.md).
#
# Mimari karari: Caddy ÖNDE (TLS + güvenlik başlıkları). /api, /files, /ws doğrudan backend'e gider
# (nginx'in 12 MB gövde sınırı video yüklemelerini keserdi); geri kalan her şey `web` (nginx) statik/SPA.
# Dışa yalnızca Caddy'nin 80/443 portu açıktır; postgres/redis/backup ağ içindedir (internal ağ, internete çıkışı yok).

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    <<: *hardening
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"          # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN gerekli (.env.prod)}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL gerekli (.env.prod)}
      MAX_BODY: ${CADDY_MAX_BODY:-55MB}           # yalniz yukleme yollari (deploy/Caddyfile @upload)
      # Saglik denetimi portu: ana port (8080) ya da izleme bindirmesinde yonetim portu (8081); bindirme bunu ezer
      BACKEND_HEALTH_PORT: ${BACKEND_HEALTH_PORT:-8080}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # sertifikalar: KAYBETMEYİN (Let's Encrypt limitleri)
      - caddy_config:/config
    networks: [edge]
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_started
    mem_limit: 256m
    cpus: 0.5
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ./web
      args:
        VITE_ADMIN_PATH: ${ADMIN_PATH:-}
    image: ${WEB_IMAGE:-bu-web:local}
    restart: unless-stopped
    ports: !reset []                   # kok compose ile birlestirilse bile 8090 yayinlanmaz
    <<: *hardening
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    networks: [edge]
    mem_limit: 128m
    cpus: 0.5
    logging: *logging

  backend:
    build: ./backend
    image: ${BACKEND_IMAGE:-bu-backend:local}
    restart: unless-stopped
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777        # ffmpeg geçici dosyaları (app.media.transcode.temp-dir)
    stop_grace_period: 40s
    mem_limit: ${BACKEND_MEM_LIMIT:-2g}
    cpus: ${BACKEND_CPUS:-2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [edge, internal]          # edge: FCM/SMTP için çıkış; internal: db/redis
    ports: !reset []                    # kok compose ile birlestirilse bile 8080 yayinlanmaz (yalniz Caddy 80/443)
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      APP_ENV: ${APP_ENV:-production}
      DB_URL: jdbc:postgresql://postgres:5432/bingol
      DB_USER: bingol
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD gerekli}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET gerekli}
      SPRING_SECURITY_USER_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD gerekli}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS gerekli (https://alan-adi)}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:?PUBLIC_WEB_URL gerekli}
      # Mesaj/gönderi-videosu şifreleme ana anahtarları: prod'da ZORUNLU (ProdSettingsValidator + KeyProvider reddeder)
      CRYPTO_MASTER_KEYS: ${CRYPTO_MASTER_KEYS:?CRYPTO_MASTER_KEYS gerekli (docs/KEY_MANAGEMENT.md)}
      CRYPTO_ACTIVE_KEY_ID: ${CRYPTO_ACTIVE_KEY_ID:?CRYPTO_ACTIVE_KEY_ID gerekli}
      CRYPTO_REQUIRE_KEYS: "true"
      CRYPTO_ADMIN_DECRYPT_ENABLED: ${CRYPTO_ADMIN_DECRYPT_ENABLED:-true}
      DEVICE_HMAC_KEY: ${DEVICE_HMAC_KEY:-}
      BAN_ALLOWLIST: ${BAN_ALLOWLIST:-}
      # Yalnızca Caddy (docker ağı, 172.16/12) X-Forwarded-For'a güvenilir; Caddy gelen sahte başlığı ezer
      APP_SECURITY_TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,127.0.0.0/8}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@bukampus.online}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-}
      MAIL_REQUIRE_TLS: ${MAIL_REQUIRE_TLS:-true}
      MAIL_SSL: ${MAIL_SSL:-false}
      MAIL_MAX_PER_MINUTE: ${MAIL_MAX_PER_MINUTE:-30}
      MAIL_RECIPIENT_GAP_SECONDS: ${MAIL_RECIPIENT_GAP_SECONDS:-300}
      MAIL_DAILY_LIMIT: ${MAIL_DAILY_LIMIT:-0}
      MAIL_DAILY_RESERVE: ${MAIL_DAILY_RESERVE:-60}
      MAIL_DAILY_RESET_HOUR_UTC: ${MAIL_DAILY_RESET_HOUR_UTC:-21}
      MAIL_UNSUBSCRIBE_KEY: ${MAIL_UNSUBSCRIBE_KEY:-}
      FCM_CREDENTIALS_JSON: ${FCM_CREDENTIALS_JSON:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      STORAGE_DIR: /data/uploads
      # DS1 depolama doluluk uyarisi (docs/DATABASE.md bolum 15): esikler ve DB sunucusu diski (olculen yol ya da kapasite)
      OBS_STORAGE_WARN_PERCENT: ${OBS_STORAGE_WARN_PERCENT:-80}
      OBS_STORAGE_CRIT_PERCENT: ${OBS_STORAGE_CRIT_PERCENT:-90}
      STORAGE_DB_DISK_PATH: ${STORAGE_DB_DISK_PATH:-}
      STORAGE_DB_DISK_CAPACITY_BYTES: ${STORAGE_DB_DISK_CAPACITY_BYTES:-0}
      STORAGE_RESERVED_BYTES: ${STORAGE_RESERVED_BYTES:-0}
      APP_OPS_BACKUP_STATUS_FILE: /backup-status/backup.prom
      # Uygulama ici yedek gostergesi (BackupStatusProvider): yedek servisi ayni dosyayi yazar (asagida backup.BACKUP_STATUS_FILE,
      # ayni host dizini ${BACKUP_METRICS_DIR}); bicim {"lastSuccessAt":"...Z"}. Yol/biçim uyusmazsa gosterge hep UNKNOWN olur (M25).
      BACKUP_STATUS_FILE: /backup-status/last-success.json
      # Gönderi videosu 40 MB: prod varsayılanı (5 MB) yeterli olmaz
      MULTIPART_MAX_FILE: ${MULTIPART_MAX_FILE:-45MB}
      MULTIPART_MAX_REQUEST: ${MULTIPART_MAX_REQUEST:-50MB}
      # Medya dönüştürme (ffmpeg) ve CDN (docs/MEDIA_PIPELINE.md, docs/DEPLOY.md bölüm 10)
      MEDIA_TRANSCODE_ENABLED: ${MEDIA_TRANSCODE_ENABLED:-true}
      MEDIA_TRANSCODE_WORKERS: ${MEDIA_TRANSCODE_WORKERS:-2}
      MEDIA_CDN_BASE_URL: ${MEDIA_CDN_BASE_URL:-}
      MEDIA_CDN_REDIRECT: ${MEDIA_CDN_REDIRECT:-false}
      # Eski DUZ gonderi videolarini arka planda sifreler (bitince false yapilabilir; docs/MEDIA_PIPELINE.md)
      MEDIA_ENCRYPT_EXISTING: ${MEDIA_ENCRYPT_EXISTING:-true}
      # Doluysa: DEK'i bu ana anahtar kimligiyle (ornek k1) sarili gonderi videolari aktif anahtarla yeniden yazilir
      MEDIA_RESEAL_KEY_ID: ${MEDIA_RESEAL_KEY_ID:-}
      INITIAL_FILL: ${INITIAL_FILL:-true}
      # Sunucu onbellegi acil kapatma (false: her istek veritabanina gider); bkz. docs/PERFORMANCE.md
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      SWAGGER_UI_ENABLED: "false"
      TZ: Europe/Istanbul
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:-}
      # ------------------------------------------------------------------------------------------------
      # .env.prod'dan GECEN ek ayarlar (T-144). `VAR:` (degersiz) = .env.prod/ortamda TANIMLIYSA konteynere iletilir,
      # TANIMSIZSA hic iletilmez (uygulamanin kendi varsayilani gecerli kalir; bos dize iletilmez). Yalniz burada
      # listelenen degiskenler iletilir: yeni ayar = buraya satir (scripts/ci/compose-env-check.sh denetler).
      # ------------------------------------------------------------------------------------------------
      # Yonetim, oturum, sozlesme (ProdSettingsValidator/LegalReacceptFilter bunlari okur)
      ADMIN_BASIC_ENABLED:
      ACTUATOR_EXPOSURE:
      MANAGEMENT_PORT:
      OPENAPI_DOCS_ENABLED:
      AUTH_VERIFY_REQUIRES_PASSWORD:
      LEGAL_ENFORCE_REACCEPT:
      MAX_DEVICES_PER_USER:
      # Erisim engelleri (accessban)
      BAN_CACHE_TTL_SECONDS:
      BAN_LOG_RETENTION_DAYS:
      BLOCK_ANONYMIZERS:
      # Veritabani havuzu ve zaman asimlari (docs/DATABASE.md)
      DB_POOL_MAX:
      DB_POOL_MIN_IDLE:
      DB_CONNECTION_TIMEOUT_MS:
      DB_CONNECT_TIMEOUT_S:
      DB_SOCKET_TIMEOUT_S:
      DB_STATEMENT_TIMEOUT_MS:
      DB_LOCK_TIMEOUT_MS:
      DB_IDLE_TX_TIMEOUT_MS:
      DB_LEAK_DETECTION_MS:
      # Redis zaman asimlari ve devre kesici (host/port compose'ta sabit: redis:6379)
      REDIS_TIMEOUT:
      REDIS_CONNECT_TIMEOUT:
      REDIS_BREAKER_MS:
      # Sunucu okuma onbellegi (CACHE_ENABLED yukarida)
      CACHE_REDIS_ENABLED:
      CACHE_L1_MAX_ENTRIES:
      CACHE_L1_TTL:
      CACHE_SHORT_TTL:
      CACHE_DAILY_TTL:
      CACHE_STABLE_TTL:
      CACHE_STALE_TTL:
      CACHE_NEGATIVE_TTL:
      CACHE_MAX_ENTRY_BYTES:
      # HTTP govde sinirlari, hiz sinirlari, parola ozeti
      HTTP_MAX_BODY_BYTES:
      HTTP_MAX_ADMIN_BODY_BYTES:
      HTTP_MAX_UPLOAD_BODY_BYTES:
      RATELIMIT_MAX_NEW_KEYS_PER_HOUR:
      RATELIMIT_OVERFLOW_MULTIPLIER:
      WS_MAX_FRAMES_PER_SECOND:
      METRICS_MAX_URI_TAGS:
      PASSWORD_HASH_CONCURRENCY:
      PASSWORD_HASH_MAX_QUEUE:
      PASSWORD_HASH_WAIT_MS:
      RL_LOGIN_IP_MAX:
      RL_LOGIN_IP_FAIL_MAX:
      RL_LOGIN_EMAIL_FAIL_MAX:
      RL_LOGIN_EMAIL_IP_FAIL_MAX:
      RL_LOGIN_PAIR_FAIL_MAX:
      RL_LOGIN_DEVICE_FAIL_MAX:
      RL_REFRESH_IP_MAX:
      RL_REFRESH_INVALID_IP_MAX:
      RL_REFRESH_USER_MAX:
      RL_RESET_IP_MAX:
      RL_VERIFY_IP_MAX:
      RL_CHPW_IP_MAX:
      RL_CODE_IP_MAX:
      RL_CODE_DEVICE_MAX:
      # E-posta ek ayarlari; APP_MAIL_ALLOW_LOG_ONLY=true yalniz BILINCLI (MAIL_ENABLED=false prod'da bu olmadan acilmaz)
      APP_MAIL_ALLOW_LOG_ONLY:
      MAIL_MAX_CODES_PER_EMAIL_PER_DAY:
      MAIL_MAX_CODE_REQUESTS_PER_IP_PER_DAY:
      MAIL_PUBLIC_CODE_SHARE:
      MAIL_RESET_CODE_SHARE:
      # Push (FCM_CREDENTIALS_FILE: konteyner ICINDEKI yol; prod'da FCM_CREDENTIALS_JSON onerilir) ve kalici kuyruk
      FCM_CREDENTIALS_FILE:
      PUSH_MESSAGE_PREVIEW:
      PUSH_OUTBOX_ENABLED:
      PUSH_OUTBOX_POLL_MS:
      PUSH_OUTBOX_BATCH:
      PUSH_OUTBOX_MAX_ATTEMPTS:
      PUSH_OUTBOX_MAX_AGE_HOURS:
      PUSH_OUTBOX_HOLD_WHEN_DISABLED:
      # Sohbet
      CHAT_EDIT_WINDOW_MINUTES:
      CHAT_DELETE_WINDOW_MINUTES:
      CHAT_DELETED_RETENTION_DAYS:
      CHAT_VIEW_ONCE_RETENTION_DAYS:
      CHAT_REACTIONS:
      CHAT_ROOM_MAX_MEMBERS:
      CHAT_ROOM_PURGE_MS:
      CHAT_EVENT_ROOM_AUTO:
      CHAT_EVENT_ROOM_CLOSE_DAYS:
      CHAT_MEDIA_CLEANUP_CRON:
      CHAT_MEDIA_LINK_TTL:
      CHAT_MEDIA_MAX_PER_MESSAGE:
      CHAT_MEDIA_PENDING_MAX:
      CHAT_MEDIA_PER_DAY:
      CHAT_MEDIA_PER_MINUTE:
      CHAT_MEDIA_UNCLAIMED_HOURS:
      CHAT_VIDEO_DAILY_LIMIT:
      CHAT_VIDEO_MAX_BYTES:
      CHAT_VIDEO_MAX_SECONDS:
      CHAT_VIDEO_MAX_TOTAL_BYTES:
      # Medya hatti (docs/MEDIA_PIPELINE.md; MEDIA_TRANSCODE_ENABLED/WORKERS/CDN_* yukarida)
      MEDIA_CONCURRENCY:
      MEDIA_MAX_PIXELS:
      MEDIA_MAX_CONCURRENT_UPLOADS:
      MEDIA_MAX_UPLOADS_PER_DAY:
      MEDIA_MAX_BYTES_PER_DAY:
      MEDIA_USER_WAIT_MS:
      MEDIA_THUMB_DIMENSION:
      MEDIA_CDN_TTL:
      MEDIA_TRANSCODE_TEMP_DIR:
      MEDIA_TRANSCODE_THREADS:
      MEDIA_TRANSCODE_TIMEOUT:
      MEDIA_AVATAR_JPEG_QUALITY:
      MEDIA_AVATAR_MAX_DIMENSION:
      MEDIA_AVATAR_MAX_STORED_BYTES:
      MEDIA_AVATAR_MAX_UPLOAD_BYTES:
      MEDIA_CHAT_JPEG_QUALITY:
      MEDIA_CHAT_MAX_DIMENSION:
      MEDIA_CHAT_MAX_STORED_BYTES:
      MEDIA_CHAT_MAX_UPLOAD_BYTES:
      MEDIA_COVER_JPEG_QUALITY:
      MEDIA_COVER_MAX_DIMENSION:
      MEDIA_COVER_MAX_STORED_BYTES:
      MEDIA_COVER_MAX_UPLOAD_BYTES:
      MEDIA_POST_JPEG_QUALITY:
      MEDIA_POST_MAX_DIMENSION:
      MEDIA_POST_MAX_STORED_BYTES:
      MEDIA_POST_MAX_UPLOAD_BYTES:
      POST_MEDIA_DELETED_RETENTION_DAYS:
      POST_MEDIA_PENDING_MAX:
      POST_MEDIA_UNATTACHED_HOURS:
      POST_MEDIA_UPLOADS_PER_HOUR:
      POST_VIDEO_MAX_BYTES:
      POST_VIDEO_MAX_SECONDS:
      # Veri saklama, bakim isleri, icerik filtresi (docs/DATABASE.md)
      DBMAINT_ENABLED:
      DBMAINT_CRON:
      DBMAINT_CHUNK_SIZE:
      DBMAINT_CHUNK_PAUSE_MS:
      DBMAINT_MAX_CHUNKS:
      DBMAINT_LOG_DAYS:
      DBMAINT_ACTIVITY_DAYS:
      DBMAINT_ADMIN_AUDIT_DAYS:
      DBMAINT_AUDIT_LONG_DAYS:
      DBMAINT_MAIL_SENT_DAYS:
      DBMAINT_MAIL_DEAD_DAYS:
      DBMAINT_NOTIFICATION_CAP:
      NOTIFICATION_RETENTION_DAYS:
      NOTIFICATION_UNREAD_RETENTION_DAYS:
      ANALYTICS_RAW_DAYS:
      ANALYTICS_MAX_EVENTS_PER_DAY:
      PUBLIC_TICKET_RETENTION_DAYS:
      POLL_CLOSE_CRON:
      PROFANITY_ENABLED:
      PROFANITY_MODE:
      PROFANITY_CACHE_TTL_SECONDS:
      # Gozlemlenebilirlik: yonetici uyari e-postasi/esikleri, depolama denetimi, Sentry (SENTRY_DSN yukarida; kullanmayacaksaniz bos)
      OBS_ALERT_ENABLED:
      OBS_ALERT_EMAIL:
      OBS_STORAGE_CHECK_MS:
      SENTRY_ENVIRONMENT:
      SENTRY_RELEASE:
      SENTRY_TRACES_SAMPLE_RATE:
      # Sifreleme ek ayarlari (CRYPTO_MASTER_KEYS yukarida)
      CRYPTO_MASTER_KEYS_FILE:
      CRYPTO_MIGRATE_MESSAGES:
      CRYPTO_NULL_PLAINTEXT:
      # Yedek hedefi: yedek servisiyle AYNI deger; ProdSettingsValidator bos ise uyarir (sir degil, rclone uzak adi)
      BACKUP_REMOTE:
    volumes:
      - uploads:/data/uploads
      # Yedek durumu (docs/OBSERVABILITY.md): backup servisinin yazdigi backup.prom, GET /api/admin/ops/backup-status icin RO
      - ${BACKUP_METRICS_DIR:-./monitoring/textfile}:/backup-status:ro
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /actuator/health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 15s
      timeout: 5s
      retries: 10
      # Soguk acilis (Flyway + Hibernate dogrulama) 262-465 sn surebilir: start_period icindeki basarisiz yoklamalar sayilmaz;
      # kisa olursa `docker compose up -d` bagimlilik (caddy) icin 'unhealthy' sayip HATA verir. deploy.sh HEALTH_WAIT_BACKEND ile uyumlu.
      start_period: ${BACKEND_START_PERIOD:-360s}

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:                       # initdb/gosu için gerekli asgari yetkiler
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_OVERRIDE
    read_only: true
    tmpfs:
      - /tmp
      - /run/postgresql
    shm_size: 256m
    mem_limit: ${POSTGRES_MEM_LIMIT:-2g}
    # PostgreSQL ayari (20k kullanici, docs/DATABASE.md bolum 6). Varsayilanlar POSTGRES_MEM_LIMIT=2g icindir;
    # 4 GB'lik makinede PG_SHARED_BUFFERS=1GB PG_EFFECTIVE_CACHE_SIZE=2560MB ile yukseltin.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.max=5000
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1280MB}
      - -c
      - work_mem=${PG_WORK_MEM:-8MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-128MB}
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-100}
      - -c
      - max_wal_size=2GB
      - -c
      - min_wal_size=256MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - autovacuum_max_workers=4
      - -c
      - autovacuum_naptime=30s
      - -c
      - autovacuum_vacuum_cost_limit=800
      - -c
      - log_autovacuum_min_duration=1s
      - -c
      - log_min_duration_statement=${PG_LOG_MIN_DURATION_MS:-500}
      - -c
      - log_lock_waits=on
      - -c
      - log_temp_files=10MB
      - -c
      - temp_file_limit=2GB
      - -c
      - track_io_timing=on
    cpus: ${POSTGRES_CPUS:-2}
    networks: [internal]
    environment:
      POSTGRES_DB: bingol
      POSTGRES_USER: bingol
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD gerekli}
    volumes:
      - pgdata:/var/lib/postgresql/data
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bingol -d bingol"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    <<: *hardening
    # redis:7-alpine giris betigi root olarak baslayip `setpriv` ile redis kullanicisina duser: cap_drop ALL tek basina
    # "setpriv: setresuid failed: Operation not permitted" ile sonsuz dongude birakir (REL1 geri yukleme provasinda bulundu).
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    read_only: true
    tmpfs:
      - /tmp
    # volatile-lru: bellek dolunca YALNIZ TTL'li anahtarlar (refresh token, hiz siniri sayaci, dogrulama kodu, presence...) atilir;
    # TTL'siz kalici isaretler (suspended:<id>) asla atilmaz. noeviction dolunca yazmalari (giris/kayit) reddederdi.
    # AOF (appendonly) korunur: yeniden baslatmada oturumlar kaybolmaz. Gerekce ve izleme: docs/DEPLOY.md "Redis".
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "200mb", "--maxmemory-policy", "volatile-lru"]
    mem_limit: ${REDIS_MEM_LIMIT:-320m}
    cpus: 0.5
    networks: [internal]
    volumes:
      - redisdata:/data
    logging: *logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Zamanlanmış yedek (SAATLİK; yerelde en yeni 7 + haftalık 4 + aylık 3, uzak kopya BACKUP_REMOTE) + haftalık otomatik geri yükleme doğrulaması. docs/BACKUP_RESTORE.md
  backup:
    build: ./scripts/backup
    restart: unless-stopped
    <<: *hardening
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER            # entrypoint postgres'e ait /var/backups icin chmod 755 yapar (yoksa konteyner donguye girer; REL1 provasi)
    mem_limit: 1g
    cpus: 1
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal, edge]          # edge: rclone/webhook çıkışı
    # age ozel anahtarinin postgres (uid 70) icin okunabilir 0400 kopyasi (entrypoint, kok iken kopyalar); diske yazilmaz
    tmpfs:
      - /run/age-key:mode=0700,uid=70,gid=70
    environment:
      PGHOST: postgres
      PGUSER: bingol
      PGDATABASE: bingol
      PGPASSWORD: ${DB_PASSWORD}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?BACKUP_AGE_RECIPIENT gerekli (age GENEL anahtari; ozel anahtar sunucuda olmaz)}
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      BACKUP_WEBHOOK_URL: ${BACKUP_WEBHOOK_URL:-}
      # YEREL saklama (dizin basina "en yeni N gecerli yedek"): saatlik 7, haftalik 4, aylik 3 (A8-01). Uzak kopya (BACKUP_REMOTE)
      # ayri ve ZORUNLUDUR: bos ise yedekler yalniz bu sunucunun diskindedir (backend acilista uyarir). Disk payi: docs/BACKUP_RESTORE.md.
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-3}
      # Durum JSON'u backend ile PAYLASILAN dizinde (${BACKUP_METRICS_DIR} = backend'de /backup-status, salt okunur); last-failure.json ayni dizinde
      BACKUP_STATUS_FILE: /var/backups/metrics/last-success.json
      BACKUP_CRON: ${BACKUP_CRON:-5 * * * *}
      BACKUP_VERIFY_CRON: ${BACKUP_VERIFY_CRON:-30 4 * * 0}
      BACKUP_VERIFY_AGE_RECIPIENT: ${BACKUP_VERIFY_AGE_RECIPIENT:-}
      # Kaynak: host'taki 0600 anahtar (baska sahip olabilir); entrypoint postgres icin /run/age-key/age.key kopyasini uretir
      BACKUP_AGE_IDENTITY_SRC: /run/backup/verify.key
      BACKUP_AGE_IDENTITY_FILE: /run/age-key/age.key
      RCLONE_CONFIG_PASS: ${RCLONE_CONFIG_PASS:-}
      TZ: Europe/Istanbul
    volumes:
      - uploads:/data/uploads:ro
      - backups:/var/backups
      # node-exporter textfile dizini (monitoring/docker-compose.monitoring.yml ile ayni yol); backup.prom buraya yazilir
      - ${BACKUP_METRICS_DIR:-./monitoring/textfile}:/var/backups/metrics
      - ./deploy/rclone:/config/rclone:ro
      - ./deploy/backup-keys:/run/backup:ro   # verify.key (yalniz DOGRULAMA ozel anahtari; bkz. docs/BACKUP_RESTORE.md)
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/backups/metrics/backup.prom && wget -q -O /dev/null http://127.0.0.1:9199/backup.prom"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  edge: {}
  internal:
    internal: true        # internete çıkış yok; postgres/redis dışarıdan erişilemez

volumes:
  pgdata:
  redisdata:
  uploads:
  backups:
  caddy_data:
  caddy_config:
