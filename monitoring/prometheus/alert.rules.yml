groups:
  - name: bu-backend
    rules:
      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "Backend yanit vermiyor"
          description: "Prometheus 2 dakikadir backend yonetim portunu kazıyamıyor."

      - alert: High5xxRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 1) > 0.02
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "5xx orani %2'yi asti"
          description: "Son 5 dakikada isteklerin %{{ $value | humanizePercentage }} kadari 5xx."

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{uri!~"/actuator.*|/ws.*"}[5m]))) > 1
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "p95 gecikme 1 sn'yi asti"
          description: "p95 = {{ $value | humanizeDuration }} (10 dakikadir)."

      - alert: DbPoolExhausted
        expr: |
          (hikaricp_connections_active / hikaricp_connections_max > 0.9) or (hikaricp_connections_pending > 0)
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "DB baglanti havuzu doyuyor"
          description: "Aktif/maks > %90 ya da bekleyen baglanti var."

      - alert: PushQueueStuck
        expr: increase(bu_push_dropped_total[15m]) > 0 or (increase(bu_push_failures_total[15m]) > 20 and increase(bu_push_delivered_total[15m]) == 0)
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Push gonderimi takildi/dusuruluyor"
          description: "Kuyruk dolu nedeniyle dusen ya da hic iletilemeyen push var (FCM kimligi/ag?)."

      - alert: MailQueueStuck
        expr: sum(bu_mail_outbox{status=~"pending|failed"}) > 100 or sum(bu_mail_outbox{status="dead"}) > 0
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "Mail kuyrugu birikti / olu kayit var"
          description: "Bekleyen+basarisiz > 100 ya da DEAD kayit mevcut (SMTP ayarlarini kontrol edin)."

      - alert: HighJvmHeap
        expr: sum(jvm_memory_used_bytes{area="heap"}) / sum(jvm_memory_max_bytes{area="heap"}) > 0.9
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "JVM heap %90 uzerinde"

  - name: bu-host
    rules:
      - alert: DiskLow
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs"}) < 0.15
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Disk bosluk %15'in altinda"
          description: "{{ $labels.mountpoint }}: %{{ $value | humanizePercentage }} bos."

      # Yedekleme metrikleri scripts/backup (lib.sh metric_write) tarafindan node_exporter textfile collector ile yazilir
      # (docs/OBSERVABILITY.md). Yedek SAATLIKtir, yerel pencere 3 saat: bu yuzden esik 3 saat (eskiden 36 saat: kurtarilabilir
      # son durum cok eskimeden haber gelmiyordu). Metrik hic yoksa da uyarir.
      - alert: BackupTooOld
        expr: (time() - backup_last_success_timestamp_seconds) > 10800 or absent(backup_last_success_timestamp_seconds)
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "Son basarili yedek 3 saatten eski ya da metrik yok"
          description: "Saatlik yedek calismiyor/basarisiz (uzak kopya dahil). docker compose logs backup; docs/BACKUP_RESTORE.md."

      - alert: BackupLastRunFailed
        expr: backup_last_status == 0
        for: 2h
        labels: {severity: critical}
        annotations:
          summary: "Son yedek denemesi basarisiz (2 saattir)"
          description: "backup_last_status=0; last-failure.json ve konteyner gunlugune bakin."

      # Haftalik geri yukleme dogrulamasi: anahtar okunamazsa/yedek bozuksa metrik 0 olur (scripts/backup/verify-restore.sh)
      - alert: BackupVerifyFailed
        expr: backup_verify_last_status == 0 and backup_verify_last_success_timestamp_seconds > 0
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "Haftalik geri yukleme dogrulamasi BASARISIZ"
          description: "Yedeklerin geri yuklenebilirligi kanitlanamadi (verify.key izni/sahipligi, bozuk dump?). docs/BACKUP_RESTORE.md."

      - alert: BackupVerifyStale
        expr: (time() - backup_verify_last_success_timestamp_seconds) > 9 * 86400
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "Basarili geri yukleme dogrulamasi 9 gunden eski (ya da hic yapilmadi)"
          description: "BACKUP_VERIFY_AGE_RECIPIENT ve deploy/backup-keys/verify.key yapilandirilmis mi? Haftalik dogrulama pazar 04:30."

      - alert: CertExpiry
        expr: (probe_ssl_earliest_cert_expiry - time()) < 14 * 86400
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "TLS sertifikasi 14 gunden az kaldi"
          description: "{{ $labels.instance }} sertifikasi {{ $value | humanizeDuration }} sonra bitiyor."

      - alert: ProbeFailed
        expr: probe_success == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Dis HTTPS yoklamasi basarisiz: {{ $labels.instance }}"
