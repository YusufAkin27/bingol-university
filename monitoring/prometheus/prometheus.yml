# Prometheus: compose agi icinde backend yonetim portunu (8081) kazir. Dis dunyaya acik DEGILDIR.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: staging

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['backend:8081']

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # TLS sertifika bitisi: blackbox exporter ile genel alan adi yoklanir (PUBLIC_HOST_URL, ornek https://api.ornek.edu.tr)
  - job_name: blackbox-https
    metrics_path: /probe
    params:
      module: [https_2xx]
    file_sd_configs:
      - files: ['/etc/prometheus/blackbox-targets.yml']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
