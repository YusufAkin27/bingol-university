version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    groups:
      spring-boot:
        patterns: ['org.springframework*', 'org.springdoc*']
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, backend]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    groups:
      react:
        patterns: ['react', 'react-dom', 'react-router*', '@types/react*']
      tooling:
        patterns: ['eslint*', '@eslint/*', 'typescript*', 'vite*', '@vitejs/*', 'vitest', '@vitest/*', 'prettier', 'globals']
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, web]

  - package-ecosystem: pub
    directory: /mobile
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, mobile]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Istanbul
    groups:
      actions:
        patterns: ['*']
    labels: [dependencies, ci]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    labels: [dependencies, docker]

  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: weekly
    labels: [dependencies, docker]
