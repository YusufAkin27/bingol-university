name: Gitleaks

# Depoya sir (anahtar, parola, token) girmesini tarar. Kurallar: .gitleaks.toml
on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '41 2 * * 1'

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Kurumsal depolarda lisans anahtari gerekebilir (kisisel hesapta gerekmez)
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
