name: Dependency review

# PR'larda yeni/guncellenen bagimliliklarin bilinen aciklarini ve lisanslarini denetler.
# Not: private repoda GitHub Advanced Security (Dependency graph) gerekir.
on:
  pull_request:

concurrency:
  group: depreview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
