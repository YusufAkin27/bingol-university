name: Dependency review

# PR'larda yeni/guncellenen bagimliliklarin bilinen aciklarini ve lisanslarini denetler.
# Not: private repoda GitHub Advanced Security (Dependency graph) gerekir.
on:
  pull_request:

concurrency:
  group: depreview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
