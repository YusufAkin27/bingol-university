name: Release Android

# v* etiketinde imzali Android App Bundle uretir (Play Store'a yukleme elle ya da fastlane ile).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.8'

jobs:
  build:
    name: AAB derle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Anahtar deposunu yaz (sirlar depoya girmez)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "ANDROID_KEYSTORE_BASE64 tanimli degil"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > android/upload-keystore.jks
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties
      - name: google-services.json (varsa)
        env:
          GS_JSON_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GS_JSON_B64" ]; then echo "$GS_JSON_B64" | base64 -d > android/app/google-services.json; fi
      - run: flutter pub get
      - run: flutter test
      - name: App Bundle
        run: flutter build appbundle --release --dart-define=API_BASE=${{ vars.API_BASE || 'https://api.example.invalid' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-release-aab
          path: mobile/build/app/outputs/bundle/release/*.aab
          retention-days: 30
      - name: Temizlik
        if: always()
        run: rm -f android/upload-keystore.jks android/key.properties android/app/google-services.json
