name: Release Android

# v* etiketinde imzali Android App Bundle uretir (Play Store'a yukleme elle ya da fastlane ile).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.8'

jobs:
  build:
    name: AAB derle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Anahtar deposunu yaz (sirlar depoya girmez)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "ANDROID_KEYSTORE_BASE64 tanimli degil"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > android/upload-keystore.jks
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties
      - name: google-services.json (varsa)
        env:
          GS_JSON_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GS_JSON_B64" ]; then echo "$GS_JSON_B64" | base64 -d > android/app/google-services.json; fi
      - run: flutter pub get
      - run: flutter test
      - name: App Bundle
        run: flutter build appbundle --release --dart-define=API_BASE=${{ vars.API_BASE || 'https://api.example.invalid' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-release-aab
          path: mobile/build/app/outputs/bundle/release/*.aab
          retention-days: 30
      - name: Temizlik
        if: always()
        run: rm -f android/upload-keystore.jks android/key.properties android/app/google-services.json
