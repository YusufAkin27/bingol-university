name: ZAP baseline

# OWASP ZAP BASELINE (pasif) taramasi: yalniz STAGING'e. Uretime asla yonlendirmeyin.
on:
  schedule:
    - cron: '17 1 * * 0'   # her pazar 01:17 UTC
  workflow_dispatch:
    inputs:
      target:
        description: 'Hedef URL (bos = vars.STAGING_URL)'
        required: false
        default: ''

permissions:
  contents: read
  issues: write

jobs:
  zap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      TARGET: ${{ inputs.target != '' && inputs.target || vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Hedef denetimi
        run: |
          if [ -z "$TARGET" ]; then echo "STAGING_URL tanimli degil"; exit 1; fi
          case "$TARGET" in https://*) ;; *) echo "Hedef https:// olmali"; exit 1;; esac
      - name: ZAP baseline (API)
        uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed # v0.14.0
        with:
          target: ${{ env.TARGET }}
          rules_file_name: .zap/rules.tsv
          cmd_options: '-a'
          allow_issue_writing: false
          artifact_name: zap-baseline-report
